<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="заглушка содержимого">
  <!-- Заглушка витрины, не ассет продукта.
       Ставится на месте пользовательского и партнёрского содержимого
       (логотипы школ, аватары, обложки курсов), которое в проде приходит
       с habrastorage.org. Такие файлы в пакет не копируются: это чужое
       содержимое, а не слой дизайн-системы. Геометрию компонента заглушка
       воспроизводит точно — размер задаёт сам компонент, не картинка. -->
  <rect width="160" height="160" fill="#f1f1f1"/>
  <path d="M0 0h160v160z" fill="#e9e9ea"/>
  <circle cx="60" cy="58" r="16" fill="#d3d3d4"/>
  <path d="M28 124l34-40 22 26 16-18 32 32z" fill="#d3d3d4"/>
  <rect x="0.5" y="0.5" width="159" height="159" fill="none" stroke="#d3d3d4"/>
</svg>
