<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptionList — Хабр Курсы</title><link rel="stylesheet" href="../../../ui/courses.css"><style>
body{box-sizing:border-box;margin:0;padding:24px;background:#fff;font-family:Inter,sans-serif}.demo{display:grid;max-width:720px;grid-template-columns:repeat(3,minmax(180px,1fr));gap:16px}.group{display:grid;align-content:start;gap:8px}.group h2{margin:0;font-size:14px}.list{overflow:hidden;border:1px solid #e9e9ea;border-radius:12px;background:#fff;padding:8px 0;box-shadow:0 8px 24px rgba(0,0,0,.08)}.item{display:flex;min-height:40px;align-items:center;gap:8px;padding:8px 16px;font-size:14px}.item[aria-selected=true]{background:#f1f1f1}.mark{width:16px;height:16px;border:1px solid #909194;border-radius:4px}.item[aria-selected=true] .mark{border-color:#346ef4;background:#346ef4}@media(max-width:767px){.demo{grid-template-columns:1fr}}
</style></head><body><div class="example-root demo">
<section class="group"><h2>Single</h2><div class="list" role="listbox" aria-label="Направление"><div class="item" role="option" aria-selected="true">Разработка</div><div class="item" role="option" aria-selected="false">Дизайн</div><div class="item" role="option" aria-selected="false">Аналитика</div></div></section>
<section class="group"><h2>Multiple</h2><div class="list" role="listbox" aria-multiselectable="true" aria-label="Навыки"><div class="item" role="option" aria-selected="true"><span class="mark"></span>Python</div><div class="item" role="option" aria-selected="false"><span class="mark"></span>SQL</div><div class="item" role="option" aria-selected="true"><span class="mark"></span>Git</div></div></section>
<section class="group"><h2>Action</h2><div class="list" role="menu" aria-label="Действия"><div class="item" role="menuitem">Сначала популярные</div><div class="item" role="menuitem">Сначала новые</div><div class="item" role="menuitem">Сначала дешевле</div></div></section>
</div></body></html>
