<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{width:min(720px,100%)}.example-root{line-height:0}.example-root>:first-child{margin:0!important}
.crs-avatar-scale{display:flex;align-items:flex-end;flex-wrap:wrap;gap:20px;padding:4px;font-family:Inter,sans-serif}
.crs-avatar-sample{display:grid;justify-items:center;gap:8px;color:#697386;font-size:11px;line-height:16px}
.crs-avatar-default{display:block;width:var(--avatar-size);height:var(--avatar-size);object-fit:cover;overflow:hidden;background:#e4edf8}
.crs-avatar-default--user{border-radius:200px}
.crs-avatar-default--school{border-radius:var(--avatar-radius)}
</style>
</head>
<body data-preview-layout="constrained"><div class="example-root"><div class="crs-avatar-scale"><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:100px;">
    <span>100×100</span>
  </span><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:68px;">
    <span>68×68</span>
  </span><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:56px;">
    <span>56×56</span>
  </span><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:48px;">
    <span>48×48</span>
  </span><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:40px;">
    <span>40×40</span>
  </span><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:36px;">
    <span>36×36</span>
  </span><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:32px;">
    <span>32×32</span>
  </span><span class="crs-avatar-sample">
    <img class="crs-avatar-default crs-avatar-default--user" src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:24px;">
    <span>24×24</span>
  </span></div></div></body>
</html>
