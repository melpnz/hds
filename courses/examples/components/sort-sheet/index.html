<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SortSheet — Хабр Курсы</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../../ui/courses.css">
  <style>
    html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{display:grid;gap:12px;width:100%}.device-switch{display:flex;gap:8px;flex-wrap:wrap}.device-switch button{height:36px;padding:0 12px;border:1px solid #e9e9ea;border-radius:12px;background:#fff;font:600 14px/20px Inter,sans-serif}.device-switch button[aria-pressed=true]{border-color:#94bdfc;background:#eff5ff;color:#346ef4}
    .sheet-stage{position:relative;box-sizing:border-box;display:flex;min-height:560px;align-items:flex-start;justify-content:center;padding:88px 24px 24px;background:#f1f1f1}.sheet-stage::before{position:absolute;top:24px;left:24px;right:24px;height:48px;border-radius:12px;background:#fff;content:""}.sheet-stage[data-device=tablet]{min-height:640px}.sheet-stage[data-device=mobile]{min-height:568px;align-items:flex-end;padding:80px 0 0;background:rgba(0,0,0,.3)}
    .sheet-stage:not([data-device=mobile]) .crs-sort-sheet{max-width:320px;padding:0;background:transparent}.sheet-stage:not([data-device=mobile]) .crs-sort-sheet__panel{overflow:hidden;border-radius:12px;box-shadow:0 8px 24px rgba(44,46,52,.16)}.sheet-stage:not([data-device=mobile]) .crs-sort-sheet__handle{display:none}.sheet-stage[data-device=mobile] .crs-sort-sheet{height:auto;max-width:320px}
  </style>
</head>
<body data-preview-layout="viewport"><div class="example-root"><div class="device-switch" role="group" aria-label="Размер экрана"><button type="button" data-device="desktop" aria-pressed="true">Desktop</button><button type="button" data-device="tablet" aria-pressed="false">Tablet</button><button type="button" data-device="mobile" aria-pressed="false">Mobile</button></div><div class="sheet-stage" data-device="desktop"><div class="crs-sort-sheet"><div class="crs-sort-sheet__panel" role="listbox" aria-label="Сортировка"><span class="crs-sort-sheet__handle" aria-hidden="true"></span><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="true">По популярности</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала дорогие</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала дешевые</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">По дате начала</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала короткие</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала длинные</button></div></div></div></div><script>const stage=document.querySelector('.sheet-stage');document.querySelectorAll('.device-switch button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.device-switch button').forEach(item=>item.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');stage.dataset.device=button.dataset.device;}));document.querySelectorAll('.crs-sort-sheet__option').forEach(option=>option.addEventListener('click',()=>{document.querySelectorAll('.crs-sort-sheet__option').forEach(item=>item.setAttribute('aria-selected','false'));option.setAttribute('aria-selected','true');}));</script></body>
</html>
