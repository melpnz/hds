<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SortSheet — Хабр Курсы</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../../ui/courses.css">
  <style>
    html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{width:100%}
    .sheet-stage{position:relative;box-sizing:border-box;display:flex;min-height:560px;align-items:flex-start;justify-content:center;padding:88px 24px 24px;background:#f1f1f1}.sheet-stage::before{position:absolute;top:24px;left:24px;right:24px;height:48px;border-radius:12px;background:#fff;content:""}
    .sheet-stage .crs-sort-sheet{max-width:320px;padding:0;background:transparent}.sheet-stage .crs-sort-sheet__panel{overflow:hidden;border-radius:12px;box-shadow:0 8px 24px rgba(44,46,52,.16)}.sheet-stage .crs-sort-sheet__handle{display:none}
    @media(max-width:767px){body{padding:0}.example-root,.sheet-stage{min-height:100vh}.sheet-stage{align-items:flex-end;padding:80px 0 0;background:rgba(0,0,0,.3)}.sheet-stage::before{display:none}.sheet-stage .crs-sort-sheet{height:auto;max-width:none;padding-top:40px;background:transparent}.sheet-stage .crs-sort-sheet__panel{border-radius:24px 24px 0 0;box-shadow:none}.sheet-stage .crs-sort-sheet__handle{display:block}}
  </style>
</head>
<body data-preview-layout="viewport"><div class="example-root"><div class="sheet-stage"><div class="crs-sort-sheet"><div class="crs-sort-sheet__panel" role="listbox" aria-label="Сортировка"><span class="crs-sort-sheet__handle" aria-hidden="true"></span><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="true">По популярности</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала дорогие</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала дешевые</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">По дате начала</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала короткие</button><button type="button" class="crs-sort-sheet__option" role="option" aria-selected="false">Сначала длинные</button></div></div></div></div><script>document.querySelectorAll('.crs-sort-sheet__option').forEach(option=>option.addEventListener('click',()=>{document.querySelectorAll('.crs-sort-sheet__option').forEach(item=>item.setAttribute('aria-selected','false'));option.setAttribute('aria-selected','true');}));</script></body>
</html>
