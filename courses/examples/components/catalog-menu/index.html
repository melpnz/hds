<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatalogMenu — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>html,body{margin:0}body{background:var(--color-white-background)}</style>
</head>
<body data-preview-layout="viewport">
  <div class="crs-catalog-menu crs-catalog-menu--with-search">
    <div class="crs-catalog-menu__search">
      <button type="button" class="crs-catalog-menu__back" aria-label="Назад"><svg class="svg-icon" aria-hidden="true"><use href="../../../ui/assets/icons/sprite.svg#arrow-large"></use></svg></button>
      <label class="crs-catalog-menu__search-field"><input class="crs-catalog-menu__search-input" type="search" placeholder="Искать на Хабр Курсах" aria-label="Поиск"><svg class="svg-icon" aria-hidden="true"><use href="../../../ui/assets/icons/sprite.svg#search"></use></svg></label>
    </div>

    <div class="crs-catalog-menu__side">
      <div class="crs-button-group" aria-label="Тип каталога">
        <button type="button" class="crs-button-group__item crs-button-group__item--selected" data-catalog-mode="adult" aria-pressed="true">Для взрослых</button>
        <button type="button" class="crs-button-group__item" data-catalog-mode="child" aria-pressed="false">Для детей</button>
      </div>
      <nav class="crs-catalog-menu__list" id="catalog-list" aria-label="Направления"></nav>
      <nav class="crs-catalog-menu__tiles" id="catalog-tiles" aria-label="Направления"></nav>
      <section class="crs-catalog-menu__suggestions" aria-labelledby="catalog-suggestions-title">
        <h2 class="crs-catalog-menu__suggestions-title" id="catalog-suggestions-title">Может быть интересно</h2>
        <nav class="crs-catalog-menu__tiles" id="catalog-suggestions" aria-label="Полезные разделы"></nav>
      </section>
    </div>

    <div class="crs-catalog-menu__mobile-detail" id="catalog-mobile-detail" aria-live="polite"></div>

    <div class="crs-catalog-menu__divider" aria-hidden="true"></div>
    <div class="crs-catalog-menu__groups" id="catalog-groups"></div>
  </div>

  <script>
    const assetRoot = '../../../ui/assets/';
    const adultDirections = [
      ['Нейросети и AI', 'code', 'neural-ai'],
      ['Разработка и IT', 'code', 'development'],
      ['Аналитика и Data Science', 'analytics', 'analytics'],
      ['Дизайн и контент', 'design', 'design'],
      ['Маркетинг и продажи', 'marketing', 'marketing'],
      ['Бизнес и менеджмент', 'business', 'business'],
      ['Языки', 'languages', 'languages'],
      ['Саморазвитие и soft skills', 'growth', 'soft-skills'],
      ['Красота и здоровье', 'wellness', 'wellness'],
      ['Хобби и творчество', 'hobby', 'hobby'],
      ['Психология', 'psychology', 'psychology'],
      ['Кулинария', 'cooking', 'cooking'],
      ['Педагогика', 'pedagogy', 'pedagogy'],
      ['Прикладные программы', 'software', 'software'],
      ['Повышение квалификации', 'college', 'continuing-education']
    ];
    const suggestions = [
      ['Подборки профессий', 'profession-collections'],
      ['Отзывы о курсах', 'reviews'],
      ['Промокоды', 'promo'],
      ['Рейтинг онлайн-школ', 'rating']
    ];
    const adultGroups = [
      ['Профессии и специализации', ['Веб-разработка', 'Frontend-разработка', 'Backend-разработка', 'Fullstack-разработка', '1С-разработка']],
      ['Мобильная разработка', ['Мобильная разработка', 'Android', 'iOS', 'Swift', 'Kotlin']],
      ['DevOps и администрирование', ['DevOps', 'Linux', 'Windows', 'Docker', 'Kubernetes']],
      ['Профессии-аналитики', ['Data-аналитика', 'Бизнес-аналитика', 'Системная аналитика', 'Продуктовая аналитика', 'Маркетинговая аналитика']],
      ['BI и визуализация', ['Power BI', 'Tableau', 'Yandex DataLens', 'Дашборды', 'Визуализация данных']],
      ['Языки программирования', ['Python', 'JavaScript', 'TypeScript', 'Java', 'C#']],
      ['Разработка игр', ['GameDev', 'Unity', 'Unreal Engine', 'Геймдизайн']],
      ['Информационная безопасность', ['Кибербезопасность', 'Этичный хакинг', 'Защита данных', 'Сетевая безопасность']],
      ['Data Science и машинное обучение', ['Data Science', 'Machine Learning', 'Нейронные сети', 'Computer Vision']],
      ['Фреймворки и библиотеки', ['React', 'Vue', 'Angular', 'Django']],
      ['Тестирование и QA', ['Ручное тестирование', 'Автоматизация тестирования', 'QA Engineer']],
      ['Базы данных и инструменты', ['SQL', 'PostgreSQL', 'Git', 'Jira']]
    ];
    const childDirections = [
      ['Подготовка к ЕГЭ', 'ege', 'child-ege'],
      ['Подготовка к ОГЭ', 'oge', 'child-oge'],
      ['Экзамены и аттестация', 'dvi', 'child-exam'],
      ['Подготовка к ДВИ', 'dvi', 'child-dvi'],
      ['Подготовиться к ВПР', 'vpr', 'child-vpr'],
      ['Подготовка к олимпиадам', 'trophy', 'child-olympiad'],
      ['Подготовка к школе', 'backpack', 'child-school'],
      ['Домашнее обучение', 'home', 'child-home-school'],
      ['Найти хобби', 'hobby', 'child-hobby'],
      ['Иностранные языки', 'languages', 'child-languages'],
      ['Расширить кругозор', 'globe', 'child-horizon'],
      ['Поступить в колледж', 'college', 'child-college']
    ];
    const childGroups = [
      ['По предметам', ['Математика', 'Русский язык', 'Обществознание', 'Информатика', 'Биология', 'Физика', 'История', 'Английский язык', 'Химия', 'Литература']],
      ['По возрасту', ['1 класс', '2 класс', '3 класс', '4 класс', '5 класс', '6 класс', '7 класс', '8 класс', '9 класс', '10 класс', '11 класс']]
    ];
    const link = (className, text) => `<a class="${className}" href="#">${text}</a>`;
    const tile = ([label, image]) => `<a class="crs-catalog-menu__tile" href="#"><span class="crs-catalog-menu__tile-label">${label}</span><img class="crs-catalog-menu__tile-image" data-catalog-image="${image}" alt=""></a>`;
    const directionTile = ([label, , image], index) => `<button class="crs-catalog-menu__tile" type="button" data-catalog-direction="${index}"><span class="crs-catalog-menu__tile-label">${label}</span><img class="crs-catalog-menu__tile-image" data-catalog-image="${image}" alt=""></button>`;
    let currentMode = 'adult';
    const closeMobileDetail = () => {
      document.querySelector('.crs-catalog-menu').dataset.mobileLevel = 'root';
      document.querySelector('#catalog-mobile-detail').replaceChildren();
    };
    const openMobileDetail = index => {
      const directions = currentMode === 'child' ? childDirections : adultDirections;
      const groups = currentMode === 'child' ? childGroups : adultGroups;
      const title = directions[index]?.[0] || directions[0][0];
      document.querySelector('#catalog-mobile-detail').innerHTML = `<h2 class="crs-catalog-menu__mobile-title">${title}</h2>${groups.map(([groupTitle, items]) => `<section class="crs-catalog-menu__group"><h3 class="crs-catalog-menu__group-title">${groupTitle}</h3><div class="crs-catalog-menu__column">${items.map(item => link('crs-catalog-menu__course', item)).join('')}${link('crs-catalog-menu__more', 'Смотреть все')}</div></section>`).join('')}`;
      document.querySelector('.crs-catalog-menu').dataset.mobileLevel = 'detail';
      document.querySelector('.crs-catalog-menu__back').focus();
    };
    const renderCatalog = mode => {
      currentMode = mode;
      closeMobileDetail();
      const directions = mode === 'child' ? childDirections : adultDirections;
      const groups = mode === 'child' ? childGroups : adultGroups;
      document.querySelector('#catalog-list').innerHTML = directions.map(([label, icon], index) => `<a class="crs-catalog-menu__row${index === 0 ? ' crs-catalog-menu__row--current' : ''}" href="#"><img class="crs-catalog-menu__row-icon" data-catalog-icon="${icon}" alt=""><span class="crs-catalog-menu__row-label">${label}</span></a>`).join('');
      document.querySelector('#catalog-tiles').innerHTML = directions.map(directionTile).join('');
      document.querySelector('#catalog-suggestions').innerHTML = suggestions.map(tile).join('');
      document.querySelector('#catalog-groups').innerHTML = groups.map(([title, items]) => `<section class="crs-catalog-menu__group"><h2 class="crs-catalog-menu__group-title">${title}</h2><div class="crs-catalog-menu__column">${items.map(item => link('crs-catalog-menu__course', item)).join('')}${link('crs-catalog-menu__more', 'Смотреть все')}</div></section>`).join('');
      document.querySelectorAll('[data-catalog-icon]').forEach(image => { image.src = assetRoot + 'icons/catalog/' + image.dataset.catalogIcon + '.svg'; });
      document.querySelectorAll('[data-catalog-image]').forEach(image => { image.src = assetRoot + 'images/catalog/' + image.dataset.catalogImage + '.png'; });
      document.querySelectorAll('[data-catalog-direction]').forEach(button => button.addEventListener('click', () => openMobileDetail(Number(button.dataset.catalogDirection))));
      document.querySelectorAll('[data-catalog-mode]').forEach(button => {
        const selected = button.dataset.catalogMode === mode;
        button.classList.toggle('crs-button-group__item--selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    };
    document.querySelector('.crs-catalog-menu__back').addEventListener('click', closeMobileDetail);
    document.querySelectorAll('[data-catalog-mode]').forEach(button => button.addEventListener('click', () => renderCatalog(button.dataset.catalogMode)));
    renderCatalog('adult');
  </script>
</body>
</html>
