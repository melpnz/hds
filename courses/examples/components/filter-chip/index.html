  <style>html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{display:flex;flex-wrap:wrap;gap:20px}.crs-chip-sample{display:grid;justify-items:start;gap:6px}.crs-chip-label{color:#697386;font:400 11px/16px Inter,sans-serif}.crs-basic-filter-chip{align-items:center;box-sizing:border-box;display:inline-flex;height:36px;justify-content:center;padding:0 12px;border:1px solid #e9e9ea;border-radius:200px;background:#fff;color:#2c2e34;font:400 14px/20px Inter,sans-serif;cursor:pointer}.crs-basic-filter-chip:hover,.crs-basic-filter-chip[data-state=hover]{border-color:#dededf}.crs-basic-filter-chip:focus-visible,.crs-basic-filter-chip[data-state=focus]{outline:0;box-shadow:0 0 0 2px #fff,0 0 0 4px #a6a7a9}.crs-basic-filter-chip:active,.crs-basic-filter-chip[data-state=pressed]{border-color:#94bdfc;background:#eff5ff;color:#346ef4}</style>
