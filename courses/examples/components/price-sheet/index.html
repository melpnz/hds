<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceSheet — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>
    html,body{margin:0;background:#fff}
    body{box-sizing:border-box;padding:24px}
    .example-root{width:100%}
    .sheet-stage{position:relative;box-sizing:border-box;display:flex;min-height:560px;align-items:flex-start;justify-content:center;padding:88px 24px 24px;background:#f1f1f1}
    .sheet-stage::before{position:absolute;top:24px;left:24px;right:24px;height:48px;border-radius:12px;background:#fff;content:""}
    .sheet-stage .crs-price-sheet{max-width:360px;padding:0;background:transparent}
    .sheet-stage .crs-price-sheet__panel{overflow:hidden;border-radius:24px;box-shadow:0 8px 24px rgba(44,46,52,.16);padding:16px}
    .sheet-stage .crs-price-sheet__handle,.sheet-stage .crs-price-sheet__title{display:none}
    .sheet-stage .crs-price-sheet__body{padding:0}
    .sheet-stage .crs-price-sheet__footer{padding:16px 0 0}
    @media(max-width:767px){
      body{padding:0}
      .example-root,.sheet-stage{min-height:100vh}
      .sheet-stage{align-items:flex-end;padding:80px 0 0;background:rgba(0,0,0,.3)}
      .sheet-stage::before{display:none}
      .sheet-stage .crs-price-sheet{height:auto;max-width:none;padding-top:40px;background:transparent}
      .sheet-stage .crs-price-sheet__panel{border-radius:24px 24px 0 0;box-shadow:none;padding:24px 24px 16px}
      .sheet-stage .crs-price-sheet__handle{display:block}
      .sheet-stage .crs-price-sheet__title{display:block}
      .sheet-stage .crs-price-sheet__footer{padding-top:16px}
    }
  </style>
</head>
<body data-preview-layout="viewport">
  <div class="example-root">
    <div class="sheet-stage">
      <div class="crs-price-sheet">
        <div class="crs-price-sheet__panel" role="dialog" aria-label="Цена">
          <span class="crs-price-sheet__handle" aria-hidden="true"></span>
          <h2 class="crs-price-sheet__title">Цена</h2>
          <div class="crs-price-sheet__body">
            <label class="crs-price-sheet__field crs-price-sheet__field--grow"><input class="crs-price-sheet__input" type="text" inputmode="numeric" placeholder="От" aria-label="Цена от"></label>
            <label class="crs-price-sheet__field crs-price-sheet__field--grow"><input class="crs-price-sheet__input" type="text" inputmode="numeric" placeholder="До" aria-label="Цена до"></label>
            <button class="crs-price-sheet__field crs-price-sheet__field--currency" type="button" aria-label="Валюта: рубли"><span class="crs-price-sheet__currency">₽</span><span class="crs-price-sheet__chevron"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#arrow-small"></use></svg></span></button>
          </div>
          <div class="crs-price-sheet__footer">
            <button class="crs-modal__button crs-modal__button--secondary crs-price-sheet__reset" type="button">Сбросить</button>
            <button class="crs-modal__button crs-modal__button--main crs-price-sheet__done" type="button">Готово</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>document.querySelector('.crs-price-sheet__reset').addEventListener('click',()=>document.querySelectorAll('.crs-price-sheet__input').forEach(input=>input.value=''));</script>
</body>
</html>
