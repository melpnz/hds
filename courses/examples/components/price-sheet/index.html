<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceSheet — Хабр Курсы</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../../ui/courses.css">
  <style>
    html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{display:grid;gap:12px;width:100%}.device-switch{display:flex;gap:8px;flex-wrap:wrap}.device-switch button{height:36px;padding:0 12px;border:1px solid #e9e9ea;border-radius:12px;background:#fff;font:600 14px/20px Inter,sans-serif}.device-switch button[aria-pressed=true]{border-color:#94bdfc;background:#eff5ff;color:#346ef4}
    .sheet-stage{position:relative;box-sizing:border-box;display:flex;min-height:560px;align-items:flex-start;justify-content:center;padding:88px 24px 24px;background:#f1f1f1}.sheet-stage::before{position:absolute;top:24px;left:24px;right:24px;height:48px;border-radius:12px;background:#fff;content:""}.sheet-stage[data-device=tablet]{min-height:640px}.sheet-stage[data-device=mobile]{min-height:568px;align-items:flex-end;padding:80px 0 0;background:rgba(0,0,0,.3)}
    .sheet-stage:not([data-device=mobile]) .crs-price-sheet{max-width:360px;padding:0;background:transparent}.sheet-stage:not([data-device=mobile]) .crs-price-sheet__panel{overflow:hidden;border-radius:24px;box-shadow:0 8px 24px rgba(44,46,52,.16)}.sheet-stage:not([data-device=mobile]) .crs-price-sheet__handle{display:none}.sheet-stage[data-device=mobile] .crs-price-sheet{height:auto;max-width:320px}
  </style>
</head>
<body data-preview-layout="viewport"><div class="example-root"><div class="device-switch" role="group" aria-label="Размер экрана"><button type="button" data-device="desktop" aria-pressed="true">Desktop</button><button type="button" data-device="tablet" aria-pressed="false">Tablet</button><button type="button" data-device="mobile" aria-pressed="false">Mobile</button></div><div class="sheet-stage" data-device="desktop"><div class="crs-price-sheet"><div class="crs-price-sheet__panel" role="dialog" aria-labelledby="price-sheet-title"><span class="crs-price-sheet__handle" aria-hidden="true"></span><h2 class="crs-price-sheet__title" id="price-sheet-title">Цена</h2><div class="crs-price-sheet__body"><label class="crs-price-sheet__field crs-price-sheet__field--grow"><input class="crs-price-sheet__input" type="text" inputmode="numeric" placeholder="От" aria-label="Цена от"></label><label class="crs-price-sheet__field crs-price-sheet__field--grow"><input class="crs-price-sheet__input" type="text" inputmode="numeric" placeholder="До" aria-label="Цена до"></label><button class="crs-price-sheet__field crs-price-sheet__field--currency" type="button" aria-label="Валюта: рубли"><span class="crs-price-sheet__currency">₽</span><span class="crs-price-sheet__chevron"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#arrow-small"></use></svg></span></button></div><div class="crs-price-sheet__footer"><button class="crs-modal__button crs-modal__button--secondary crs-price-sheet__reset" type="button">Сбросить</button><button class="crs-modal__button crs-modal__button--main crs-price-sheet__done" type="button">Готово</button></div></div></div></div></div><script>const stage=document.querySelector('.sheet-stage');document.querySelectorAll('.device-switch button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.device-switch button').forEach(item=>item.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');stage.dataset.device=button.dataset.device;}));document.querySelector('.crs-price-sheet__reset').addEventListener('click',()=>document.querySelectorAll('.crs-price-sheet__input').forEach(input=>input.value=''));</script></body>
</html>
