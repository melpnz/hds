<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromoCodeModal — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>
    html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}
    .example-root{display:grid;gap:12px;width:100%}.variant-switch{display:flex;gap:8px;flex-wrap:wrap}.variant-switch button{height:36px;padding:0 12px;border:1px solid #e9e9ea;border-radius:12px;background:#fff;font:600 14px/20px Inter,sans-serif}.variant-switch button[aria-pressed=true]{border-color:#94bdfc;background:#eff5ff;color:#346ef4}.crs-promo-code-modal[hidden]{display:none}
    .promo-stage{display:flex;box-sizing:border-box;min-height:560px;align-items:center;justify-content:center;padding:32px;background:rgba(0,0,0,.3)}
    @media(max-width:767px){body{padding:0}.example-root,.promo-stage{min-height:100vh}.variant-switch{margin:24px 24px 0}.promo-stage{align-items:flex-end;padding:48px 0 0}.promo-stage .crs-promo-code-modal{max-width:320px;border-radius:24px 24px 0 0}}
  </style>
</head>
<body data-preview-layout="viewport">
  <div class="example-root">
    <div class="variant-switch" role="group" aria-label="Тип предложения"><button type="button" data-variant="code" aria-pressed="true">Промокод</button><button type="button" data-variant="action" aria-pressed="false">Акция</button></div>
    <div class="promo-stage">
      <div class="crs-promo-code-modal" role="dialog" aria-label="Промокод Skillbox">
        <p class="crs-promo-code-modal__title">Skillbox</p>
        <div class="crs-promo-code-modal__body">
          <div class="crs-promo-code-modal__offer"><p class="crs-promo-code-modal__offer-title">Скидка 35% на курсы по дизайну</p><p class="crs-promo-code-modal__offer-text">Введите промокод на сайте школы или назовите менеджеру при покупке</p></div>
          <div class="crs-promo-code-modal__meta"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#datepicker"></use></svg><span>Действует до 30 октября 2025</span></div>
          <div class="crs-promo-code-modal__code"><p class="crs-promo-code-modal__code-value">PROMOCODE</p><button type="button" class="inline-flex h-12 min-h-12 w-full cursor-pointer items-center justify-center rounded-xl border border-ui-black-850 bg-ui-black-850 px-4 py-2 text-default font-semibold text-ui-white">Скопировать и перейти</button></div>
        </div>
        <div class="crs-promo-code-modal__footer"><button type="button" class="inline-flex h-10 cursor-pointer items-center justify-center rounded-xl border border-ui-black-50 bg-ui-black-50 px-4 py-2 text-small font-semibold text-ui-black-850">Закрыть</button></div>
      </div>
      <div class="crs-promo-code-modal" data-variant="action" role="dialog" aria-label="Акция Skillbox" hidden>
        <p class="crs-promo-code-modal__title">Skillbox</p>
        <div class="crs-promo-code-modal__body"><div class="crs-promo-code-modal__offer"><p class="crs-promo-code-modal__offer-title">Скидка 35% на курсы по дизайну</p><p class="crs-promo-code-modal__offer-text">Предложение применится на сайте школы автоматически</p></div><div class="crs-promo-code-modal__meta"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#datepicker"></use></svg><span>Действует до 30 октября 2025</span></div><div class="crs-promo-code-modal__code"><button type="button" class="inline-flex h-12 min-h-12 w-full cursor-pointer items-center justify-center rounded-xl border border-ui-black-850 bg-ui-black-850 px-4 py-2 text-default font-semibold text-ui-white">Перейти на сайт</button></div></div>
        <div class="crs-promo-code-modal__footer"><button type="button" class="inline-flex h-10 cursor-pointer items-center justify-center rounded-xl border border-ui-black-50 bg-ui-black-50 px-4 py-2 text-small font-semibold text-ui-black-850">Закрыть</button></div>
      </div>
    </div>
  </div>
  <script>
    const stage=document.querySelector('.promo-stage');
    document.querySelectorAll('.variant-switch button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.variant-switch button').forEach(item=>item.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');const action=button.dataset.variant==='action';stage.querySelector('[data-variant="action"]').hidden=!action;stage.querySelector('.crs-promo-code-modal:not([data-variant])').hidden=action;}));
  </script>
</body>
</html>
