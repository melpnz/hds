<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaqItem — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{display:grid;gap:16px;width:min(645px,100%)}.crs-state-label{color:#697386;font:400 11px/16px Inter,sans-serif}.crs-state-sample{display:grid;gap:6px}</style>
</head>
<body data-preview-layout="constrained"><div class="example-root">
  <div class="crs-state-sample"><span class="crs-state-label">Expanded · нажмите, чтобы свернуть</span><div class="crs-faq-item crs-faq-item--expanded"><button type="button" class="crs-faq-item__question" aria-expanded="true"><span class="crs-faq-item__title">Сложно ли стать Python-разработчиком?</span><span class="crs-faq-item__chevron"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#arrow-small"></use></svg></span></button><div class="crs-faq-item__answer"><p>Обучение проходит дистанционно через специальную платформу. После регистрации студент получает доступ к учебным материалам и практическим заданиям.</p></div></div></div>
  <div class="crs-state-sample"><span class="crs-state-label">Hover</span><div class="crs-faq-item"><button type="button" class="crs-faq-item__question" data-state="hover" aria-expanded="false"><span class="crs-faq-item__title">Какие знания нужны для старта?</span><span class="crs-faq-item__chevron"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#arrow-small"></use></svg></span></button></div></div>
  <div class="crs-state-sample"><span class="crs-state-label">Focus-visible</span><div class="crs-faq-item"><button type="button" class="crs-faq-item__question" data-state="focus" aria-expanded="false"><span class="crs-faq-item__title">Можно ли учиться в своём темпе?</span><span class="crs-faq-item__chevron"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#arrow-small"></use></svg></span></button></div></div>
</div><script>document.querySelectorAll('.crs-faq-item__question').forEach(button=>button.addEventListener('click',()=>{const item=button.closest('.crs-faq-item');const open=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!open));item.classList.toggle('crs-faq-item--expanded',!open);const answer=item.querySelector('.crs-faq-item__answer');if(answer)answer.hidden=open;}));</script></body>
</html>
