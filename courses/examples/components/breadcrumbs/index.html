  <style>html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{width:min(880px,100%)}.crs-breadcrumbs-demo{display:grid;gap:20px;padding:24px;border-radius:24px;background:var(--color-ui-blue-500)}.crs-breadcrumbs-demo__title{margin:0;color:#fff;font:600 14px/20px Inter,sans-serif}.crs-breadcrumbs-states{display:flex;flex-wrap:wrap;gap:24px}.crs-breadcrumbs-state{display:grid;gap:6px}.crs-breadcrumbs-state__name{color:rgba(255,255,255,.72);font:400 11px/16px Inter,sans-serif}</style>

<body data-preview-layout="constrained"><div class="example-root"><section class="crs-breadcrumbs-demo"><h2 class="crs-breadcrumbs-demo__title">Production · hero</h2><nav class="crs-breadcrumbs crs-breadcrumbs--hero" aria-label="Хлебные крошки"><a class="crs-breadcrumbs__item" href="#courses">Все курсы</a><span class="crs-breadcrumbs__sep" aria-hidden="true"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#arrow-small"></use></svg></span><a class="crs-breadcrumbs__item" href="#design">Курсы по направлению «Дизайн и контент»</a><span class="crs-breadcrumbs__sep" aria-hidden="true"><svg class="svg-icon" width="24" height="24"><use xlink:href="../../../ui/assets/icons/sprite.svg#arrow-small"></use></svg></span><span class="crs-breadcrumbs__item crs-breadcrumbs__item--current" aria-current="page">Курсы по 3D моделированию</span></nav><div class="crs-breadcrumbs-states"><span class="crs-breadcrumbs-state"><span class="crs-breadcrumbs-state__name">Hover</span><a class="crs-breadcrumbs__item" data-state="hover" href="#hover">Все курсы</a></span><span class="crs-breadcrumbs-state"><span class="crs-breadcrumbs-state__name">Focus-visible</span><a class="crs-breadcrumbs__item" data-state="focus" href="#focus">Все курсы</a></span><span class="crs-breadcrumbs-state"><span class="crs-breadcrumbs-state__name">Current</span><span class="crs-breadcrumbs__item crs-breadcrumbs__item--current" aria-current="page">Курсы по 3D моделированию</span></span></div></section></div></body>
