<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdSlot — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}</style>
</head>
<body data-preview-layout="viewport">
  <div class="example-root">
    <section class="crs-ad-slot-demo adfox-banner" aria-label="Рекламные предложения">
      <div class="crs-ad-slot-demo__viewport banner-swiper">
        <div class="crs-ad-slot-demo__track">
          <article class="crs-ad-slot-demo__card">
            <img class="crs-ad-slot-demo__image" src="../../../ui/assets/images/carousel/ad-promo.png" alt="Скидки до 60% на обучение в онлайн-школах">
            <span class="crs-ad-slot-demo__label">РЕКЛАМА</span>
            <button class="crs-ad-slot-demo__more" type="button" aria-label="Информация о рекламе">•••</button>
          </article>
          <article class="crs-ad-slot-demo__card" data-current="true">
            <img class="crs-ad-slot-demo__image" src="../../../ui/assets/images/carousel/ad-previous.png" alt="Курсы дешевле, чем у школ">
            <span class="crs-ad-slot-demo__label">РЕКЛАМА</span>
            <button class="crs-ad-slot-demo__more" type="button" aria-label="Информация о рекламе">•••</button>
          </article>
          <article class="crs-ad-slot-demo__card">
            <img class="crs-ad-slot-demo__image" src="../../../ui/assets/images/carousel/ad-ai.png" alt="Обучение работе с искусственным интеллектом">
            <span class="crs-ad-slot-demo__label">РЕКЛАМА</span>
            <button class="crs-ad-slot-demo__more" type="button" aria-label="Информация о рекламе">•••</button>
          </article>
        </div>
      </div>
      <div class="crs-ad-slot-demo__pagination" aria-hidden="true"><span class="crs-ad-slot-demo__dot"></span><span class="crs-ad-slot-demo__dot"></span><span class="crs-ad-slot-demo__dot"></span></div>
    </section>
  </div>
  <script>const track=document.querySelector('.crs-ad-slot-demo__track');const current=track.querySelector('[data-current="true"]');const centerCurrent=()=>{const trackBox=track.getBoundingClientRect();const itemBox=current.getBoundingClientRect();track.style.scrollBehavior='auto';track.scrollLeft+=(itemBox.left+itemBox.width/2)-(trackBox.left+trackBox.width/2);requestAnimationFrame(()=>track.style.removeProperty('scroll-behavior'));};requestAnimationFrame(()=>requestAnimationFrame(centerCurrent));window.addEventListener('load',centerCurrent,{once:true});</script>
</body>
</html>
