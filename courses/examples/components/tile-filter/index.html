<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TileFilter — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>
html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{width:min(760px,100%)}
.crs-tile-filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font-family:Inter,sans-serif}.crs-tile-filter-sample{display:grid;justify-items:center;gap:6px}.crs-tile-filter-state{color:#697386;font-size:11px;line-height:16px}
.crs-tile-filter{display:flex;width:122px;flex-direction:column;align-items:center;gap:8px;margin:0;padding:0;border:0;background:transparent;color:#2c2e34;font:400 12px/16px Inter,sans-serif;cursor:pointer}.crs-tile-filter__surface{box-sizing:border-box;display:grid;width:122px;height:122px;padding:20px;border:1px solid #e9e9ea;border-radius:16px;background:#fff;place-items:center}.crs-tile-filter__image{display:block;width:80px;height:80px}.crs-tile-filter__label{width:100%;text-align:center}
.crs-tile-filter:hover .crs-tile-filter__surface,.crs-tile-filter[data-state=hover] .crs-tile-filter__surface{border-color:#d3d3d4}.crs-tile-filter:focus-visible,.crs-tile-filter[data-state=focus]{outline:0}.crs-tile-filter:focus-visible .crs-tile-filter__surface,.crs-tile-filter[data-state=focus] .crs-tile-filter__surface{box-shadow:0 0 0 2px #fff,0 0 0 4px #a6a7a9}.crs-tile-filter:active .crs-tile-filter__surface,.crs-tile-filter[data-state=pressed] .crs-tile-filter__surface{border-color:#94bdfc;background:#eff5ff}.crs-tile-filter[data-state=pressed]{color:#346ef4}.crs-tile-filter:disabled,.crs-tile-filter[data-state=disabled]{color:#a6a7a9;cursor:not-allowed}.crs-tile-filter:disabled .crs-tile-filter__surface,.crs-tile-filter[data-state=disabled] .crs-tile-filter__surface{border-color:#f1f1f1;background:#f7f7f7}.crs-tile-filter:disabled .crs-tile-filter__image,.crs-tile-filter[data-state=disabled] .crs-tile-filter__image{opacity:.45}
@media(max-width:560px){.crs-tile-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.crs-tile-filter,.crs-tile-filter__surface{width:84px}.crs-tile-filter__surface{height:84px;padding:12px}.crs-tile-filter__image{width:60px;height:60px}}
  </style>
</head>
<body data-preview-layout="constrained"><div class="example-root"><div class="crs-tile-filter-grid">
  <span class="crs-tile-filter-sample"><span class="crs-tile-filter-state">Default</span><button class="crs-tile-filter" type="button" data-state="default" aria-pressed="false"><span class="crs-tile-filter__surface"><img src="../../../ui/assets/images/star.png" alt="" class="crs-tile-filter__image"></span><span class="crs-tile-filter__label">Популярное</span></button></span>
  <span class="crs-tile-filter-sample"><span class="crs-tile-filter-state">Hover</span><button class="crs-tile-filter" type="button" data-state="hover" aria-pressed="false"><span class="crs-tile-filter__surface"><img src="../../../ui/assets/images/star.png" alt="" class="crs-tile-filter__image"></span><span class="crs-tile-filter__label">Популярное</span></button></span>
  <span class="crs-tile-filter-sample"><span class="crs-tile-filter-state">Focus-visible</span><button class="crs-tile-filter" type="button" data-state="focus" aria-pressed="false"><span class="crs-tile-filter__surface"><img src="../../../ui/assets/images/star.png" alt="" class="crs-tile-filter__image"></span><span class="crs-tile-filter__label">Популярное</span></button></span>
  <span class="crs-tile-filter-sample"><span class="crs-tile-filter-state">Pressed</span><button class="crs-tile-filter" type="button" data-state="pressed" aria-pressed="true"><span class="crs-tile-filter__surface"><img src="../../../ui/assets/images/star.png" alt="" class="crs-tile-filter__image"></span><span class="crs-tile-filter__label">Популярное</span></button></span>
  <span class="crs-tile-filter-sample"><span class="crs-tile-filter-state">Disabled</span><button class="crs-tile-filter" type="button" data-state="disabled" aria-pressed="false" disabled><span class="crs-tile-filter__surface"><img src="../../../ui/assets/images/star.png" alt="" class="crs-tile-filter__image"></span><span class="crs-tile-filter__label">Популярное</span></button></span>
</div></div></body>
</html>
