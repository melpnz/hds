<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FilterModal — Хабр Курсы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:0}
.crs-filter-modal-stage{display:grid;min-height:620px;background:rgba(44,46,52,.12);place-items:start center;font-family:Inter,sans-serif}
.crs-filter-modal[hidden],.crs-filter-modal-reopen[hidden]{display:none}
.crs-filter-modal-reopen{align-self:center;padding:12px 20px;border:0;border-radius:12px;background:#2c2e34;color:#fff;font:600 16px/24px Inter,sans-serif}
.crs-filter-modal__body{padding-top:0;padding-bottom:0}
.crs-filter-modal__group{flex:none}
.crs-filter-modal__recommendations{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.crs-filter-modal__recommendations::-webkit-scrollbar{display:none}
.crs-filter-modal__recommendation{display:grid;flex:0 0 124px;gap:8px;padding:0 0 4px;border:0;background:transparent;color:#2c2e34;font:400 12px/16px Inter,sans-serif;text-align:center}
.crs-filter-modal__recommendation-image{box-sizing:border-box;width:124px;height:124px;overflow:hidden;border:1px solid #e9e9ea;border-radius:16px;background:#fff}
.crs-filter-modal__recommendation[aria-pressed=true]{color:#346ef4}
.crs-filter-modal__recommendation[aria-pressed=true] .crs-filter-modal__recommendation-image{border-color:#94bdfc;background:#eff5ff}
.crs-filter-modal__recommendation img{display:block;width:100%;height:100%;object-fit:cover}
.crs-filter-modal__options{gap:4px}
.crs-filter-modal__chip{height:36px;padding:8px 12px;border:1px solid #e9e9ea;border-radius:200px;background:#fff;color:#2c2e34;font:400 14px/20px Inter,sans-serif;white-space:nowrap}
.crs-filter-modal__chip:hover{border-color:#dededf}
.crs-filter-modal__chip:focus-visible{outline:2px solid #bcbdbf;outline-offset:2px}
.crs-filter-modal__chip[aria-pressed=true]{border-color:#94bdfc;background:#eff5ff;color:#346ef4}
.crs-filter-modal__price{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crs-filter-modal__price-chart{position:relative;grid-column:1/-1;display:flex;align-items:end;height:64px;padding:0 10px 8px;border-bottom:1px solid #d3d3d4}
.crs-filter-modal__price-chart i{width:4px;margin-right:2px;background:#6bacfd;border-radius:2px 2px 0 0}
.crs-filter-modal__price input,.crs-filter-modal__search{box-sizing:border-box;width:100%;height:40px;padding:0 12px;border:1px solid #e9e9ea;border-radius:12px;background:#fff;color:#2c2e34;font:400 14px/20px Inter,sans-serif}
.crs-filter-modal__selectbox{overflow:hidden;border:1px solid #e9e9ea;border-radius:12px}
.crs-filter-modal__selectbox .crs-filter-modal__search{border:0;border-bottom:1px solid #e9e9ea;border-radius:0}
.crs-filter-modal__list{max-height:144px;padding:8px 0;overflow-y:auto;scrollbar-color:#a6a7a9 #e9e9ea}
.crs-filter-modal__option{display:flex;align-items:flex-start;gap:8px;min-height:40px;padding:8px 16px;box-sizing:border-box;font:400 14px/20px Inter,sans-serif}
.crs-filter-modal__option input{width:20px;height:20px;margin:0;accent-color:#346ef4}
.crs-filter-modal__school-mark{display:grid;width:20px;height:20px;border-radius:6px;background:#eff5ff;color:#346ef4;font:700 10px/1 Inter,sans-serif;place-items:center}
.crs-filter-modal__levels{display:grid;gap:4px}
.crs-filter-modal__level{display:grid;grid-template-columns:24px 1fr;gap:4px;min-height:64px;padding:11px 12px;border:1px solid #e9e9ea;border-radius:12px;background:#fff;color:#2c2e34;text-align:left}
.crs-filter-modal__level[aria-pressed=true]{border-color:#94bdfc;background:#eff5ff;color:#346ef4}
.crs-filter-modal__level img{display:block;width:24px;height:24px}
.crs-filter-modal__level span{display:grid;gap:2px;font:400 14px/20px Inter,sans-serif}
.crs-filter-modal__level small{color:#697386;font:400 12px/16px Inter,sans-serif}
@media(max-width:479px){.crs-filter-modal-stage{min-height:620px}.crs-filter-modal__recommendation{flex-basis:84px}.crs-filter-modal__recommendation-image{width:84px;height:84px}}
</style>
</head>
<body data-preview-layout="viewport"><div class="example-root"><div class="crs-filter-modal-stage"><button class="crs-filter-modal-reopen" id="filter-modal-open" type="button" hidden>Открыть фильтры</button><div class="crs-filter-modal" id="filter-modal-target" role="dialog" aria-modal="true" aria-labelledby="filter-modal-title"><header class="crs-filter-modal__header"><h1 class="crs-filter-modal__title" id="filter-modal-title">Поиск обучения</h1><button type="button" class="crs-filter-modal__close" id="filter-modal-close" aria-label="Закрыть"><svg class="svg-icon" width="24" height="24" viewBox="0 0 24 24"><use xlink:href="../../../ui/assets/icons/sprite.svg#menu-close"></use></svg></button></header><div class="crs-filter-modal__body" id="filter-modal-body" tabindex="0" aria-label="Параметры фильтра"><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Рекомендуем вам</h2><div class="crs-filter-modal__recommendations"><button class="crs-filter-modal__recommendation" type="button" aria-pressed="false"><span class="crs-filter-modal__recommendation-image"><img src="../../../ui/assets/images/filter-modal/recommendation-career.png" alt=""></span><span>Карьерные консультации</span></button><button class="crs-filter-modal__recommendation" type="button" aria-pressed="false"><span class="crs-filter-modal__recommendation-image"><img src="../../../ui/assets/images/filter-modal/recommendation-certificate.png" alt=""></span><span>Сертификат после курса</span></button><button class="crs-filter-modal__recommendation" type="button" aria-pressed="true"><span class="crs-filter-modal__recommendation-image"><img src="../../../ui/assets/images/filter-modal/recommendation-free.png" alt=""></span><span>Бесплатная часть</span></button><button class="crs-filter-modal__recommendation" type="button" aria-pressed="false"><span class="crs-filter-modal__recommendation-image"><img src="../../../ui/assets/images/filter-modal/recommendation-mentor.png" alt=""></span><span>Поддержка ментора</span></button></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Тип обучения</h2><div class="crs-filter-modal__options"><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Курс</button><button class="crs-filter-modal__chip" type="button" aria-pressed="true">Вебинар</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Симулятор</button></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Цена</h2><div class="crs-filter-modal__price"><div class="crs-filter-modal__price-chart" aria-hidden="true"><i style="height:12px"></i><i style="height:18px"></i><i style="height:24px"></i><i style="height:16px"></i><i style="height:30px"></i><i style="height:38px"></i><i style="height:28px"></i><i style="height:44px"></i><i style="height:34px"></i><i style="height:52px"></i><i style="height:40px"></i><i style="height:58px"></i><i style="height:46px"></i><i style="height:62px"></i><i style="height:54px"></i><i style="height:42px"></i><i style="height:32px"></i><i style="height:24px"></i></div><input aria-label="Цена от" value="0 ₽"><input aria-label="Цена до" value="999 999 ₽"></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Тематика/навыки/инструменты</h2><div class="crs-filter-modal__selectbox"><input class="crs-filter-modal__search" type="search" placeholder="Что изучить?" aria-label="Что изучить?"><div class="crs-filter-modal__list"><label class="crs-filter-modal__option"><input type="checkbox"><span>Python разработчик</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>Аналитик данных</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>UX/UI-дизайнер</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>Менеджер проектов</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>Интернет-маркетолог</span></label></div></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Уровень обучения</h2><div class="crs-filter-modal__levels"><button class="crs-filter-modal__level" type="button" aria-pressed="false"><img src="../../../ui/assets/icons/filter-grade-min.svg" alt=""><span>Для начинающих (Intern/Junior)<small>С нуля или только начали разбираться в теме</small></span></button><button class="crs-filter-modal__level" type="button" aria-pressed="true"><img src="../../../ui/assets/icons/filter-grade-mid.svg" alt=""><span>Средний уровень (Middle)<small>Хотите углубиться или прокачать навык</small></span></button><button class="crs-filter-modal__level" type="button" aria-pressed="false"><img src="../../../ui/assets/icons/filter-grade-max.svg" alt=""><span>Продвинутый (Senior/Lead)<small>Развить глубокую экспертизу в работе</small></span></button></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Школа</h2><div class="crs-filter-modal__selectbox"><input class="crs-filter-modal__search" type="search" placeholder="Поиск по школам" aria-label="Поиск по школам"><div class="crs-filter-modal__list"><label class="crs-filter-modal__option"><input type="checkbox"><span class="crs-filter-modal__school-mark">1</span><span>Skillbox</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span class="crs-filter-modal__school-mark">2</span><span>Skillfactory</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span class="crs-filter-modal__school-mark">3</span><span>Слёрм</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span class="crs-filter-modal__school-mark">4</span><span>Логомашина</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span class="crs-filter-modal__school-mark">5</span><span>Международная школа профессий</span></label></div></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Длительность</h2><div class="crs-filter-modal__options"><button class="crs-filter-modal__chip" type="button" aria-pressed="false">До 3 мес</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">От 3 до 6 мес</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">От 6 до 12 мес</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">От 1 года</button></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Формат обучения</h2><div class="crs-filter-modal__options"><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Индивидуально</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">В группе</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Онлайн</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Офлайн</button></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Местоположение</h2><div class="crs-filter-modal__selectbox"><input class="crs-filter-modal__search" type="search" placeholder="Поиск по городу" aria-label="Поиск по городу"><div class="crs-filter-modal__list"><label class="crs-filter-modal__option"><input type="checkbox"><span>Москва</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>Санкт-Петербург</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>Пермь</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>Петропавловск-Камчатский</span></label><label class="crs-filter-modal__option"><input type="checkbox"><span>Пенза</span></label></div></div></section><section class="crs-filter-modal__group"><h2 class="crs-filter-modal__group-title">Дополнительно</h2><div class="crs-filter-modal__options"><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Акции и скидки</button><button class="crs-filter-modal__chip" type="button" aria-pressed="true">Есть куратор</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Есть рассрочка</button><button class="crs-filter-modal__chip" type="button" aria-pressed="true">Только бесплатные курсы</button><button class="crs-filter-modal__chip" type="button" aria-pressed="false">Только онлайн курсы</button></div></section></div><footer class="crs-filter-modal__footer"><button type="button" class="crs-filter-modal__button crs-filter-modal__button--secondary" id="filter-modal-reset">Очистить всё</button><button type="button" class="crs-filter-modal__button crs-filter-modal__button--main">Показать 30 560 курсов</button></footer></div></div></div><script>
const filterModal=document.querySelector('#filter-modal-target');
const filterModalOpen=document.querySelector('#filter-modal-open');
document.querySelector('#filter-modal-close').addEventListener('click',()=>{filterModal.hidden=true;filterModalOpen.hidden=false;filterModalOpen.focus();});
filterModalOpen.addEventListener('click',()=>{filterModal.hidden=false;filterModalOpen.hidden=true;document.querySelector('#filter-modal-close').focus();});
document.querySelectorAll('.crs-filter-modal__chip,.crs-filter-modal__recommendation,.crs-filter-modal__level').forEach(control=>control.addEventListener('click',()=>control.setAttribute('aria-pressed',String(control.getAttribute('aria-pressed')!=='true'))));
document.querySelector('#filter-modal-reset').addEventListener('click',()=>{document.querySelectorAll('.crs-filter-modal input[type=checkbox]').forEach(control=>control.checked=false);document.querySelectorAll('.crs-filter-modal [aria-pressed=true]').forEach(control=>control.setAttribute('aria-pressed','false'));document.querySelector('#filter-modal-body').scrollTo({top:0,behavior:'smooth'});});
</script></body>
</html>
