<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informer — Хабр Курсы</title><link rel="stylesheet" href="../../../ui/courses.css"><style>
body{box-sizing:border-box;margin:0;padding:24px;background:#fff;font-family:Inter,sans-serif}.demo{display:grid;max-width:720px;gap:16px}.informer{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--accent);border-radius:12px;background:var(--surface);padding:16px;color:#2c2e34}.informer[data-tone=info]{--accent:#346ef4;--surface:#eff5ff}.informer[data-tone=success]{--accent:#38a169;--surface:#edf9f1}.informer[data-tone=warning]{--accent:#e6a700;--surface:#fff8df}.informer[data-tone=error]{--accent:#e35b5b;--surface:#fff0f0}.icon{color:var(--accent);font-size:20px}.copy{display:grid;flex:1;gap:4px}.copy strong{font-size:16px;line-height:1.375}.copy span,.copy a{font-size:14px;line-height:1.43}.copy a{color:#346ef4}.close{border:0;background:none;color:var(--accent);font-size:20px}
</style></head><body><div class="example-root demo">
<section class="informer" data-tone="info" role="status"><span class="icon">ⓘ</span><div class="copy"><strong>Информация</strong><span>Описание важного сообщения для пользователя.</span><a href="#">Подробнее</a></div><button class="close" aria-label="Закрыть">×</button></section>
<section class="informer" data-tone="success" role="status"><span class="icon">✓</span><div class="copy"><strong>Готово</strong><span>Изменения успешно сохранены.</span></div></section>
<section class="informer" data-tone="warning" role="alert"><span class="icon">!</span><div class="copy"><strong>Обратите внимание</strong><span>Проверьте введённые данные.</span></div></section>
<section class="informer" data-tone="error" role="alert"><span class="icon">×</span><div class="copy"><strong>Ошибка</strong><span>Не удалось выполнить действие.</span></div></section>
</div></body></html>
