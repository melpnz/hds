<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast — Хабр Курсы</title><link rel="stylesheet" href="../../../ui/courses.css"><style>
body{box-sizing:border-box;margin:0;padding:24px;background:#fff;font-family:Inter,sans-serif}.demo{display:flex;max-width:720px;flex-wrap:wrap;gap:12px}.toast{display:flex;align-items:flex-start;gap:8px;border-radius:12px;padding:12px 16px;color:#fff;font-size:16px;line-height:1.375}.toast[data-tone=info]{background:#346ef4}.toast[data-tone=success]{background:#38a169}.toast[data-tone=warning]{background:#d49300}.toast[data-tone=error]{background:#d94b4b}.toast button{border:0;background:none;color:inherit;font-size:20px;line-height:1}
</style></head><body><div class="example-root demo">
<div class="toast" data-tone="info" role="status">Сообщение<button aria-label="Закрыть">×</button></div>
<div class="toast" data-tone="success" role="status">Изменения сохранены<button aria-label="Закрыть">×</button></div>
<div class="toast" data-tone="warning" role="alert">Требуется внимание<button aria-label="Закрыть">×</button></div>
<div class="toast" data-tone="error" role="alert">Не удалось сохранить<button aria-label="Закрыть">×</button></div>
</div></body></html>
