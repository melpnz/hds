<head>

  <link rel="stylesheet" href="../../../ui/courses.css">
  <style>html,body{margin:0;background:#fff}body{box-sizing:border-box;padding:24px}.example-root{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;width:min(520px,100%)}.identity-kind{display:grid;justify-items:start;gap:12px;padding:20px;border:1px solid var(--color-ui-black-100);border-radius:var(--courses-radius-16)}.identity-kind h2,.identity-kind p{margin:0}.identity-kind h2{font-size:16px;line-height:22px}.identity-kind p{color:var(--color-ui-black-500);font-size:12px;line-height:16px}@media(max-width:479px){.example-root{grid-template-columns:1fr}}</style>

<body data-preview-layout="context"><div class="example-root"><section class="identity-kind"><h2>Avatar · пользователь</h2><img src="../../../ui/assets/images/avatar-default-user.svg" alt="" style="--avatar-size:68px" class="h-[var(--avatar-size)] w-[var(--avatar-size)] overflow-hidden rounded-full object-contain" data-component="avatar" data-size="68"><p>Круглая форма, дефолтное изображение пользователя.</p></section><section class="identity-kind"><h2>EntityLogo · школа</h2><img src="../../../ui/assets/images/avatar-default-company.svg" alt="" class="crs-entity-logo" data-component="entity-logo" data-size="68"><p>Скруглённый квадрат, дефолтное изображение компании.</p></section></div></body>
