<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Machine-first гайд публичного интерфейса Хабр Курсов">
  <title>Хабр Курсы — гайд v1.0</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar__top">
        <a class="brand" href="#colors" aria-label="К основам гайда">
          <span class="brand__mark">К</span>
          <span><strong id="product-title">Хабр Курсы</strong><small>machine-first guide</small></span>
        </a>
        <button class="catalog-toggle" type="button" aria-expanded="false" aria-controls="navigation">Каталог</button>
      </div>
      <div class="search">
        <label class="search__label" for="guide-search">Поиск по гайду</label>
        <div class="search__control">
          <span aria-hidden="true">⌕</span>
          <input id="guide-search" type="search" placeholder="Кнопка, loading…" autocomplete="off">
          <kbd>Ctrl K</kbd>
        </div>
        <span class="search__meta" id="search-meta" aria-live="polite"></span>
      </div>
      <p class="sidebar__label">Каталог</p>
      <nav id="navigation" aria-label="Разделы гайда"></nav>
      <footer class="sidebar__foot">
        <span id="guide-version">Guide v1.0 · пригоден к использованию</span>
        <a href="../machine/index.json">machine/index.json</a>
      </footer>
    </aside>

    <main class="content">
      <header class="content__head">
        <div>
          <p class="eyebrow">Живой пример</p>
          <h1 id="item-title">Загрузка…</h1>
        </div>
        <div class="badges" id="item-badges"></div>
      </header>

      <section class="preview-card" aria-labelledby="preview-title">
        <div class="preview-source" id="preview-source" hidden>
          <strong>Источник превью</strong>
          <div role="group" aria-label="Источник превью">
            <button type="button" data-preview-source="guide" aria-pressed="true">Пример гайда</button>
            <button type="button" data-preview-source="provider" aria-pressed="false">UI Kit</button>
          </div>
          <span>UI Kit требует локально запущенный интегрированный preview</span>
        </div>
        <div class="preview-toolbar">
          <strong id="preview-title">Preview</strong>
          <div class="viewport-controls" id="viewport-controls" aria-label="Ширина примера"></div>
          <span id="viewport-meta">по ширине контейнера</span>
        </div>
        <div class="example-tabs" id="example-tabs" role="tablist" aria-label="Примеры"></div>
        <div class="preview-stage">
          <iframe class="preview-frame" id="preview" title="Интерактивный пример компонента"></iframe>
          <div class="preview-missing" id="preview-missing" hidden></div>
        </div>
        <div class="example-stack" id="example-stack" hidden></div>
      </section>

      <aside class="preview-notes" id="preview-notes" aria-labelledby="preview-notes-title" hidden></aside>

      <article class="guide" id="guide" aria-live="polite"></article>
      <details class="raw-data">
        <summary>Машинная спецификация</summary>
        <pre id="raw-json"></pre>
      </details>
      <p class="source-link">Источник: <a id="spec-source" href="#">—</a></p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
