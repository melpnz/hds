<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
/* Монохромная палитра: светло-серый фон, белые карточки без рамок, почти чёрный акцент; цвета важности приглушены */
:root{
  --bg:#ededee;--surface:#fff;--raised:#f7f7f8;--sunken:#f1f1f2;--ink:#1d1d1f;--ink-2:#4b4b50;--muted:#8b8b91;--line:#eaeaec;--line-2:#d9d9dd;--card-line:transparent;
  --accent:#1d1d1f;--accent-soft:#ececee;--on-accent:#fff;--focus:#1d1d1f;--link:#3557c8;
  --critical:#c8463d;--critical-soft:#f8e6e4;--major:#b5741b;--major-soft:#f5ebdc;--minor:#7a7a80;--minor-soft:#eeeef0;--discuss:#6c5aae;--discuss-soft:#ebe8f4;
  --ok:#3d8a5b;--ok-soft:#e4f0e8;--mark:#ff2e8a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#08080a;--surface:#1c1c20;--raised:#232328;--sunken:#141417;--ink:#f3f3f5;--ink-2:#c8c8ce;--muted:#909097;--line:#2c2c31;--line-2:#3d3d44;--card-line:#2a2a30;
  --accent:#f1f1f2;--accent-soft:#2a2a2e;--on-accent:#111113;--focus:#f1f1f2;--link:#93abff;
  --critical:#ff7b72;--critical-soft:#3a1f1d;--major:#e3a54e;--major-soft:#3a2c17;--minor:#a3a3aa;--minor-soft:#242428;--discuss:#b3a1ff;--discuss-soft:#2a2540;--ok:#63c58a;--ok-soft:#18301f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#08080a;--surface:#1c1c20;--raised:#232328;--sunken:#141417;--ink:#f3f3f5;--ink-2:#c8c8ce;--muted:#909097;--line:#2c2c31;--line-2:#3d3d44;--card-line:#2a2a30;
  --accent:#f1f1f2;--accent-soft:#2a2a2e;--on-accent:#111113;--focus:#f1f1f2;--link:#93abff;
  --critical:#ff7b72;--critical-soft:#3a1f1d;--major:#e3a54e;--major-soft:#3a2c17;--minor:#a3a3aa;--minor-soft:#242428;--discuss:#b3a1ff;--discuss-soft:#2a2540;--ok:#63c58a;--ok-soft:#18301f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
button,select,textarea,input{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-block:12px;flex-wrap:wrap}
.title{display:flex;flex-direction:column;gap:2px;min-width:0}
.title h1{margin:0;font-size:18px;line-height:1.25;font-weight:650}
.title .sub{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar{width:120px;height:6px;border-radius:9px;background:var(--sunken);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:18px 0 6px}
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.sumcard h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow span{color:var(--ink-2)}.srow small{color:var(--muted);font-size:11px;margin-left:4px}
.srow b{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.srow.critical b{color:var(--critical)}.srow.major b{color:var(--major)}.srow.minor b{color:var(--minor)}.srow.discuss b{color:var(--discuss)}.srow.improve b{color:var(--accent)}.srow.hum b{color:var(--ok)}
.srow.good b{color:var(--ok)}.srow.mid b{color:var(--major)}.srow.bad b{color:var(--critical)}
.qchk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:8px}
.sumcard .qi{color:var(--muted);font-size:11px;margin-top:4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.1;font-weight:650}
.stat span{color:var(--muted);font-size:12px}
.stat.critical b{color:var(--critical)}.stat.major b{color:var(--major)}.stat.minor b{color:var(--minor)}.stat.discuss b{color:var(--discuss)}.stat.improve b{color:var(--accent)}
.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:550}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{opacity:.6;margin-left:4px;font-weight:400}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--line-2)}
.sep{width:1px;background:var(--line);margin:0 4px}
/* overflow:clip, а не hidden — иначе не работает липкая шапка карточки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0 18px;overflow:clip;scroll-margin-top:12px}
.card-sticky{position:sticky;top:0;z-index:8;background:var(--surface);border-radius:14px 14px 0 0;box-shadow:0 1px 0 var(--line),0 6px 12px -10px rgba(0,0,0,.35)}
.card-bar{padding:2px 18px 10px}
.card-bar .vbar{margin-bottom:0}
.card-bar .range.above{margin:8px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border:1.5px solid;border-radius:2px}
.legend i.dash{background:none;border:2px dashed var(--mark)}
.legend code,.dev code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.dev{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--raised);font-size:13px;min-width:0}
.dev>b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:500}
.dev-row{display:flex;gap:8px;align-items:baseline;margin:3px 0;min-width:0}
.dev-k{font-size:11px;color:var(--muted);min-width:44px}
.dev code.sel{background:var(--sunken);border-radius:5px;padding:2px 6px;overflow-wrap:anywhere;color:var(--ink)}
.dev .warn{font-size:11px;color:var(--major)}
.dev-cls{margin:6px 0;font-size:12px;color:var(--muted)}.dev-cls summary{cursor:pointer}.dev-cls code{display:block;margin-top:4px;overflow-wrap:anywhere;color:var(--ink-2)}
pre.css{margin:8px 0;background:var(--sunken);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;white-space:pre}
.dev-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.btn.mini{padding:3px 8px;font-size:12px;border-radius:6px}
.rbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:16px 0 8px}.rbar .hint{margin:8px 0 0}
.ract{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.rcard{background:#fff;color:#172b4d;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:12px 0;font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
.rcard h1{margin:0 0 6px;font-size:20px;font-weight:600}.rcard h2{margin:0 0 6px;font-size:17px;font-weight:600}
.rarea{margin:26px 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}.rcard a{color:#0c66e4}.rcard code{background:#f1f2f4;border-radius:3px;padding:1px 4px;font:12px ui-monospace,Consolas,monospace}
.rcard pre{background:#f7f8f9;border:1px solid #dcdfe4;border-radius:4px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;overflow-x:auto}
.rcard table{border-collapse:collapse;margin:8px 0;max-width:100%}.rcard td{border:1px solid #dcdfe4;padding:6px 10px;vertical-align:top}
.rimg{display:block;max-width:100%;cursor:copy;border-radius:4px}.rimg:hover{outline:2px solid #0c66e4}
.rcard .saved{color:#626f86}
.rcard .btn{background:#fff;color:#172b4d;border-color:#dcdfe4}.rcard .btn:hover{border-color:#172b4d}
.jira-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
[data-token-usage]{grid-column:1/-1;overflow-x:auto}
[data-token-usage]>summary{cursor:pointer;font-weight:600}
[data-token-usage] .usage-body{padding-top:12px}
[data-token-usage] table{width:100%;border-collapse:collapse;text-align:left}
[data-token-usage] th,[data-token-usage] td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
[data-reference-status="missing"] .stage,[data-reference-status="missing"] .pane{background:#fff}
.pane.solo svg.crop{max-width:760px;margin:0 auto}
.pill.mk{color:var(--discuss);background:var(--discuss-soft)}
.pill.pg{color:var(--accent);background:var(--accent-soft)}
.card.is-mockup-verdict{box-shadow:inset 4px 0 0 var(--discuss)}
.decision .seg button[data-v=mockup][aria-pressed=true],.decision .seg button[data-v=fix][aria-pressed=true]{background:var(--discuss);color:#fff}
.srow.mk b{color:var(--discuss)}.srow.sc b{color:var(--muted)}
.card.is-scope-verdict{box-shadow:inset 4px 0 0 var(--line-2)}.card.is-scope-verdict .card-shots{opacity:.6}
.decision .seg button[data-v=scope][aria-pressed=true]{background:var(--muted);color:#fff}
.decision .seg{flex-wrap:wrap}
.scope-hint{font-size:12px;color:var(--muted);margin-top:8px}
.card.focused{box-shadow:0 0 0 2px var(--accent)}
.card-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 6px;flex-wrap:wrap}
.card-title{font-size:16px;font-weight:650;line-height:1.35;margin:0}
.meta-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;letter-spacing:.01em}
.sev-critical{color:var(--critical);background:var(--critical-soft)}.sev-major{color:var(--major);background:var(--major-soft)}.sev-minor{color:var(--minor);background:var(--minor-soft)}.sev-discuss{color:var(--discuss);background:var(--discuss-soft)}
.cat{color:var(--ink-2);background:var(--sunken)}
.wpill{color:var(--muted);border:1px solid var(--line);background:none}
.id{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.card-shots{padding:8px 18px 14px}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.card-body>.desc{padding:14px 18px 18px;min-width:0}
@media (max-width:900px){.card-body{grid-template-columns:1fr}}
.why{color:var(--ink-2);margin:0 0 10px}
.fix{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13px}
.fix b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.props{width:100%;border-collapse:collapse;font-size:13px}
.props th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-bottom:1px solid var(--line)}
.props td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.props td.v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.swatch{display:inline-block;width:11px;height:11px;border:1px solid var(--line-2);border-radius:3px;margin-right:5px;vertical-align:-1px}
.props td.d{color:var(--critical);font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap}
.viewer{min-width:0}
.vbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:repeating-conic-gradient(var(--sunken) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pair>.pane+.pane{border-left:1px solid var(--line)}.pair.three{grid-template-columns:1fr 1fr 1fr}
.pill.rc{background:var(--sunken);font-weight:600}.pill.rc-bad{background:#ffeceb;color:#ae2e24}.pill.rc-ok{background:#dcfff1;color:#216e4e}
.pane{position:relative;min-width:0}
.pane .lbl,.stack .lbl{position:absolute;top:6px;left:6px;z-index:3;font-size:11px;font-weight:600;background:rgba(15,17,21,.78);color:#fff;border-radius:5px;padding:2px 6px;pointer-events:none}
.stack .lbl.r{left:auto;right:6px}
svg.crop{display:block;width:100%;height:auto;max-height:560px}
.stack{position:relative}
.stack svg.crop{max-height:640px}
.stack .top{position:absolute;inset:0}
.stack.diff .top{mix-blend-mode:difference}
.handle{position:absolute;top:0;bottom:0;width:2px;background:var(--mark);z-index:4;cursor:ew-resize}
.handle::after{content:"";position:absolute;top:50%;left:-9px;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--mark);box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.range{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.range input{flex:1}
.range.above{margin:0 0 8px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.decision{border-left:1px solid var(--line);padding:14px 18px 18px;background:var(--raised);display:flex;flex-direction:column;min-width:0}
.decision h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.decision textarea.note{flex:1;min-height:110px}
@media (max-width:900px){.decision{border-left:0;border-top:1px solid var(--line)}}
svg.crop{max-height:640px}
.theme-switch{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface)}
.theme-switch button{border:0;background:none;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.theme-switch button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.theme-switch .sw-k{font-size:12px;color:var(--muted);padding:0 4px 0 8px;align-self:center}
.decision .seg button{padding:6px 11px;font-size:13px}
.decision .seg button[data-v=bug][aria-pressed=true],.decision .seg button[data-v=take][aria-pressed=true]{background:var(--ok);color:#fff}
.decision .seg button[data-v=notbug][aria-pressed=true],.decision .seg button[data-v=skip][aria-pressed=true]{background:var(--minor);color:#fff}
.decision .seg button[data-v=ok][aria-pressed=true]{background:var(--major);color:#fff}
.decision .seg button[data-v=discuss][aria-pressed=true]{background:var(--discuss);color:#fff}
.dec-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.autosave{font-size:12px;color:var(--muted);max-width:340px;line-height:1.3}.autosave.bad{color:var(--critical,#c9372c);font-weight:600}
textarea.note{width:100%;margin-top:10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;resize:vertical}
.scope{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:6px}
.scope select{border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:2px 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:16px 0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h3{margin:0 0 6px;font-size:14px}
.box ul{margin:0;padding-left:18px;color:var(--ink-2)}
.cov{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.cov th,.cov td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cov th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
.yes{color:var(--ok);font-weight:600}.no{color:var(--muted)}
.method{color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.full-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.full{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full .col{border:1px solid var(--line);border-radius:12px;overflow:auto;height:75vh;background:var(--surface)}
.full .col img{display:block;width:100%;height:auto}
.full .cap{position:sticky;top:0;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;z-index:2}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(760px,92vw);padding:18px}
dialog textarea{width:100%;height:50vh;font:12px/1.45 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sunken)}
.kbd{font:11px ui-monospace,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
footer.foot{color:var(--muted);font-size:12px;padding:28px 0 40px}
.stat.widths b{font-size:16px;line-height:1.5}
@media (max-width:700px){
  .summary{grid-template-columns:1fr;gap:8px}
  .pair,.pair.three{grid-template-columns:1fr}.pair>.pane+.pane{border-left:0;border-top:1px solid var(--line)}
  .full{grid-template-columns:1fr}.full .col{height:60vh}
}
/* качество навыка: точность/полнота по разметке дизайнера */
.quality{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0 0;font-size:13px}
.quality .q{display:flex;align-items:baseline;gap:6px}
.quality .q b{font-size:18px;font-weight:650}
.quality .q span{color:var(--muted);font-size:12px}
.quality .q.good b{color:var(--ok)}.quality .q.mid b{color:var(--major)}.quality .q.bad b{color:var(--critical)}
.quality label{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12px;margin-left:auto}
.quality .qi{color:var(--muted);font-size:12px;flex-basis:100%}
.reasons{margin-top:10px}
.reasons .rk{font-size:12px;color:var(--muted);margin-bottom:6px}
.reasons .chip[aria-pressed=true]{background:var(--minor);border-color:var(--minor);color:#fff}
/* пропущенное ИИ: форма и карточки */
.mform,.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0 18px}
.mform h3{margin:0 0 12px;font-size:15px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}}
.mgrid .full-row{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:7px 10px;color:var(--ink);font-size:14px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.wchips{display:flex;gap:6px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--raised)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:132px;height:92px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunken)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:rgba(15,17,21,.75);color:#fff;font-size:11px;padding:1px 6px;cursor:pointer}
.mactions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.mcard .card-title{margin-bottom:6px}
.mcard .why{white-space:pre-wrap}
.mcard .links{display:flex;flex-direction:column;gap:2px;font-size:13px;overflow-wrap:anywhere;margin-bottom:6px}
.mcard .thumbs .thumb{width:220px;height:150px}
.human{color:var(--ok);background:var(--ok-soft)}
.err{color:var(--critical);font-size:12px}
dialog.img{width:auto;max-width:94vw;padding:8px}dialog.img img{max-width:90vw;max-height:84vh;display:block}
/* --- оформление в духе референса: карточки без рамок, «таблетки», лёгкие начертания */
body{letter-spacing:-.005em}
a{color:var(--link)}
header.top{background:transparent;border-bottom:0}
.title .sub a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}.title .sub a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.top-row{padding-block:18px 6px}
.title h1{font-weight:600;font-size:19px;letter-spacing:-.015em}
.btn{border-radius:999px;padding:7px 15px;border-color:var(--line-2);background:var(--surface);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{opacity:.88}
.btn.mini{border-radius:999px;padding:4px 11px}
.progress .bar i{background:var(--accent)}
.sumcard,.card,.mform,.mcard,.box,.cov,.method,.rbar,.empty{border-color:var(--card-line)}
.sumcard,.card,.mform,.mcard{border-radius:18px}
.sumcard{padding:16px 18px}
.sumcard h3{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:500;margin-bottom:8px}
.srow{border-bottom-color:var(--line)}
.srow b{font-weight:500;font-size:17px}
.tabs{border-bottom:0;gap:4px;margin:22px 0 0;padding:4px;background:var(--surface);border-radius:999px;width:max-content;max-width:100%}
.tab{border:0;border-radius:999px;padding:7px 15px;font-weight:500;color:var(--ink-2)}
.tab:hover{background:var(--sunken)}
.tab[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
.tab .n{opacity:.55}
.chip{border-color:var(--line-2);background:var(--surface);padding:5px 12px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{border-radius:999px;border-color:var(--line-2);background:var(--surface)}
.seg button{padding:5px 12px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.theme-switch{border-color:var(--line-2)}
.theme-switch button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.card-sticky{border-radius:18px 18px 0 0;box-shadow:0 1px 0 var(--line)}
.card-title{font-weight:600;letter-spacing:-.01em}
.card.focused{box-shadow:0 0 0 2px var(--accent)}
.pill{border-radius:999px;font-weight:500;padding:2px 9px}
.cat{background:var(--sunken);color:var(--ink-2)}
.wpill{border-color:var(--line-2)}
.stage{border-radius:14px;border-color:var(--line)}
.dev,.fix{border-color:var(--line);border-radius:12px}
.decision{background:var(--raised)}
/* решения — отдельные «таблетки» с переносом, а не одна сегментированная полоса */
.decision .seg{border:0;background:none;overflow:visible;gap:6px;flex-wrap:wrap;border-radius:0}
.decision .seg button{padding:6px 13px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface)}
.decision .seg button+button{border-left:1px solid var(--line-2)}
.decision .seg button:hover{border-color:var(--ink)}
.decision .seg button[aria-pressed=true]{border-color:transparent}
.theme-switch button{padding:4px 9px;font-size:13px}
.actions{gap:6px}
textarea.note,.fld input,.fld select,.fld textarea{border-radius:12px;border-color:var(--line-2)}
.full .col{border-radius:16px;border-color:var(--card-line)}
.full .cap{background:var(--accent);color:var(--on-accent)}
dialog{border-radius:18px;border-color:var(--line)}
.rbar{border-radius:18px}
.rcard{border-radius:18px;border-color:var(--card-line)}
/* фильтр «Решение»: Неразобранные / Баг / Не баг … с числом находок */
.dec-filters{margin:14px 0 0;align-items:center}
.dec-filters+.filters{margin-top:8px}
.fk{font-size:12px;color:var(--muted);margin-right:4px}
.chip .n{margin-left:6px;opacity:.55;font-variant-numeric:tabular-nums}
.chip.dv-none:not([aria-pressed=true]){border-style:dashed}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap top-row">
  <div class="title"><h1 id="h1"></h1><div class="sub" id="sub"></div></div>
  <div class="actions">
    <div class="progress" title="Сколько находок уже получили решение"><span id="progText"></span><span class="bar"><i id="progBar"></i></span></div>
    <button class="btn primary" id="reportBtn" title="Задачи в том виде, как они должны выглядеть в Jira — скопировать оттуда">Отчёт</button>
    <button class="btn" hidden id="jiraBtn" title="Подтверждённые баги в формате для Jira / YouTrack">Задачи для Jira</button>
    <button class="btn" hidden id="mdBtn" title="Весь отчёт в Markdown с картинками — для задачи в Jira, GitLab, YouTrack">Отчёт в Markdown</button>
    <button class="btn" id="mkBtn" title="Что поправить в самом макете: проверка макета и расхождения с решением «Ошибка в макете» — со ссылками на слои">Правки в макет</button>
    <span class="autosave" id="autoSave" role="status"></span>
    <button class="btn" hidden id="jsonBtn" title="Файл с вашей разметкой: решения, причины, пропущенное. Принесите его Claude — он дообучит навык">Разметка для обучения</button>
    <button class="btn" hidden id="saveBtn" title="HTML-файл с вашими решениями внутри">Сохранить с решениями</button>
    <div class="theme-switch" role="group" aria-label="Что показывать слева" id="sideSwitch" title="Что показывать слева"><span class="sw-k">Слева:</span><button data-side="a"></button><button data-side="b"></button></div>
    <div class="theme-switch" role="group" aria-label="Тема" id="themeSwitch"><button data-theme-v="light" title="Светлая тема" aria-label="Светлая тема">☀</button><button data-theme-v="dark" title="Тёмная тема" aria-label="Тёмная тема">☾</button></div>
  </div>
</div></header>

<main class="wrap">
  <section class="summary" id="summary"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="view-bugs" class="view"></section>
  <section id="view-missed" class="view" hidden></section>
  <section id="view-mockup" class="view" hidden></section>
  <section id="view-qa" class="view" hidden></section>
  <section id="view-other" class="view" hidden></section>
  <section id="view-fixed" class="view" hidden></section>
  <section id="view-improve" class="view" hidden></section>
  <section id="view-match" class="view" hidden></section>
  <section id="view-full" class="view" hidden></section>
  <section id="view-report" class="view" hidden></section>
  <section id="view-scope" class="view" hidden></section>
  <footer class="foot">Клавиши: <span class="kbd">J</span>/<span class="kbd">K</span> — следующая/предыдущая находка, <span class="kbd">1</span>–<span class="kbd">6</span> — решение, <span class="kbd">M</span> — режим сравнения. Открыт через «Открыть отчёт.cmd» — решения сохраняются в папку отчёта сами, а после «Отчёта» рядом появляется и разметка для обучения (feedback-*.json). Открыт с диска — решения только в этом браузере.</footer>
</main>

<dialog id="dlg"><h3 id="dlgTitle" style="margin:0 0 10px"></h3><textarea id="dlgText" readonly></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><span class="saved" id="dlgState" style="margin-right:auto;align-self:center"></span><button class="btn" id="dlgZip" hidden title="report.md и папка img/ с картинками «сайт | макет»">Скачать .zip</button><button class="btn" id="dlgMdRich" hidden title="Markdown и форматированный текст сразу: редактор сам возьмёт подходящее. Картинки в текст Jira не встраиваются — они в .zip">Скопировать</button><button class="btn" id="dlgRich" hidden title="Форматированный текст со ссылками — для Jira Cloud, Confluence, YouTrack. Картинки — «2. Картинка» у находки">Скопировать форматированный</button><button class="btn" id="dlgCopy">Скопировать текст</button><button class="btn primary" id="dlgClose">Закрыть</button></div></dialog>

<dialog id="imgDlg" class="img"><img id="imgDlgImg" alt=""><div style="text-align:right;margin-top:6px"><button class="btn" onclick="this.closest('dialog').close()">Закрыть</button></div></dialog>

<script type="application/json" id="decisions">{}</script>
<script>
const DATA=/*__DATA__*/null;
const IMAGES=/*__IMAGES__*/null;
let EMBEDDED={};try{EMBEDDED=JSON.parse(document.getElementById('decisions').textContent||'{}')}catch{}
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const SEV={critical:'Критично',major:'Заметно',minor:'Мелочь',discuss:'Обсудить'};
const CAT={responsive:'Адаптив',typography:'Типографика',spacing:'Отступы',text:'Текст',absent:'Отсутствует',structure:'Структура',color:'Цвет',size:'Размеры',content:'Контент',state:'Состояния',layout:'Раскладка',mockup:'Макет',radius:'Скругления',size:'Размеры'};
// «Ошибка в макете» — сайт прав, макет нет: подсвечивается и идёт в «Правки в макет», но в точность/полноту навыка не входит
// «Другой функционал» — расхождение реальное, но относится к тому, что сейчас не проверяем (чужой виджет, личный кабинет,
// другая фича): помечается, в задачи этого ревью и в качество навыка не входит
const BUG_V=[['bug','Баг','1'],['notbug','Не баг','2'],['ok','Допустимо','3'],['discuss','Обсудить','4'],['mockup','Ошибка в макете','5']];
// «Другой функционал» (v:'scope') — не кнопка решения, а перенос между вкладками: кнопка на карточке, клавиша 6
const OUT_V=['mockup','scope']; // вне метрик и задач
const MK_V=[['fix','Поправить в макете','1'],['skip','Не важно','2'],['discuss','Обсудить','4']];
const IMP_V=[['take','Берём','1'],['skip','Не сейчас','2'],['discuss','Обсудить','4']];
// Почему «Не баг» — по причине навык понимает, какое правило ошиблось (см. «Разбор обратной связи» в SKILL.md)
const REASONS=[['wrong-pair','Сравнил не те элементы'],['data','Данные / контент'],['variant','Другой вариант или состояние'],['capture','Артефакт снимка'],['tolerance','Мелочь, в пределах допуска'],['intended','Так задумано'],['duplicate','Дубль другой находки'],['other','Другое (в комментарии)']];
const MODES=[['side','Рядом'],['swipe','Шторка'],['onion','Наложение'],['diff','Разница']];
// ключ хранения решений: стабильный id прогона (не меняется при пересборке); старые отчёты — по адресу и дате
const storeKey=DATA.meta.runId?'dr:run:'+DATA.meta.runId:'dr:'+DATA.meta.testUrl+':'+DATA.meta.createdAt;

// Картинки — в blob-URL, чтобы не дублировать мегабайты data: в каждом SVG.
const IMG={};
for(const [k,v] of Object.entries(IMAGES)){const b=atob(v.src.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);IMG[k]={url:URL.createObjectURL(new Blob([a],{type:'image/png'})),w:v.w,h:v.h,src:v.src}}
// Нормализация: отчёт работает и для «макет ↔ сайт» (figma/page), и для «прод ↔ стенд» (a/b), снимки — по id (ширина + состояние).
const L=DATA.meta.labels||{a:'Макет',b:'Сайт'};
// Какая сторона слева: по умолчанию эталон (макет/прод) слева; выбор запоминается в браузере.
let SWAP=false;try{SWAP=localStorage.getItem('dr-swap')==='1'}catch{}
const order=(a,b)=>SWAP?[b,a]:[a,b];
DATA.meta.widths.forEach(s=>{s.id=String(s.id??s.w);s.aImg=s.aImg||s.figmaImg;s.bImg=s.bImg||s.pageImg});
DATA.findings.forEach(f=>{(f.evidence=f.evidence||[]).forEach(e=>{e.a=e.a||e.figma;e.b=e.b||e.page;e.shot=String(e.shot??e.w)});(f.props=f.props||[]).forEach(p=>{p.a=p.a??p.figma;p.b=p.b??p.site})});
const shotInfo=id=>DATA.meta.widths.find(x=>x.id===String(id));
// Несколько пар «страница ↔ макет» (merge-pages.mjs): у кадра — page, у находки — page; ссылки — из своей пары
const PAGES=DATA.meta.pages&&DATA.meta.pages.length>1?DATA.meta.pages:null;
const pageMeta=pid=>(PAGES&&PAGES.find(p=>p.id===pid))||DATA.meta;
const pageTitle=pid=>PAGES?(PAGES.find(p=>p.id===pid)?.title||pid):'';
const shotLabel=s=>(PAGES&&s.page?pageTitle(s.page)+' · ':'')+s.w+' px'+(s.state&&s.state!=='default'?' · '+s.state:'');
const metaOf=ev=>pageMeta(shotInfo(ev?.shot)?.page);

let decisions={};try{decisions=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
for(const [id,d] of Object.entries(EMBEDDED)){if(!decisions[id]||(d.at||'')>(decisions[id].at||''))decisions[id]=d}
// слитые находки (mergedFrom) — решение переносится со старого id, если у новой его ещё нет
for(const f of DATA.findings)if(!decisions[f.id])for(const old of f.mergedFrom||[])if(decisions[old]){decisions[f.id]={...decisions[old]};break}
// старый ключ (адрес + дата) — подхватить решения, сделанные до появления runId
if(DATA.meta.runId){try{const old=JSON.parse(localStorage.getItem('dr:'+DATA.meta.testUrl+':'+DATA.meta.createdAt)||'{}');for(const [k,v] of Object.entries(old))if(!decisions[k])decisions[k]=v}catch{}}
// агент отметил «не по задаче этого ревью» (outOfScope: true или строка — к чему относится) — сразу «Другой функционал»; дизайнер может вернуть «Баг»
for(const f of DATA.findings)if(f.outOfScope&&!decisions[f.id])decisions[f.id]={v:'scope',note:typeof f.outOfScope==='string'?f.outOfScope:'',auto:true};
const persist=()=>{remoteSave();try{localStorage.setItem(storeKey,JSON.stringify(decisions));return true}catch{return false}};
// Автосохранение: отчёт открыт через serve-report.mjs («Открыть отчёт.cmd») — решения сами пишутся в папку прогона
// (decisions.json, report.html, а после открытия «Отчёта» — и разметка для обучения feedback-*.json).
// Открыт с диска — сохранить в файл нельзя: решения живут в браузере, запасные кнопки «Сохранить с решениями» и «Разметка».
const SRV=window.DR_SERVER||null;let saveT=null,saveFail=false;
function remoteSave(now){if(!SRV)return;clearTimeout(saveT);saveT=setTimeout(()=>doSave(false),now?0:600)}
function savePayload(final){return JSON.stringify({decisions,final,feedback:decisions.__report?{name:feedbackName(),data:feedbackPayload()}:null})}
async function doSave(final){
  try{const r=await fetch('/api/save?t='+SRV.token,{method:'POST',headers:{'Content-Type':'application/json'},body:savePayload(final)});const j=await r.json();if(!j.ok)throw 0;
    saveFail=false;autoSaveState(`Сохранено в папку отчёта · ${new Date(j.savedAt).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}${j.feedback?' · разметка для обучения обновлена':''}`)}
  catch{saveFail=true;autoSaveState('Не сохранилось: окно «Открыть отчёт» закрыто? Запустите его снова — решения из браузера не пропадут',true);$('#saveBtn').hidden=false}
}
function autoSaveState(t,bad){const s=$('#autoSave');if(!s)return;s.textContent=t;s.classList.toggle('bad',!!bad)}
if(SRV){addEventListener('pagehide',()=>{clearTimeout(saveT);navigator.sendBeacon('/api/save?t='+SRV.token,new Blob([savePayload(true)],{type:'text/plain'}))});
  document.addEventListener('focusout',e=>{if(e.target.matches?.('textarea,input'))remoteSave(true)})}

const state={tab:'bugs',dec:new Set(),pg:new Set(),sev:new Set(),cat:new Set(),w:new Set(),mode:{},ev:{},focus:null};
const bugs=DATA.findings.filter(f=>f.kind==='bug'),imps=DATA.findings.filter(f=>f.kind==='improvement'),mocks=DATA.findings.filter(f=>f.kind==='mockup');
// Механика (kind:'qa'): то, что заметно «как тестировщик» (логика, сортировка, синхронизация) — отдельно от дизайн-ревью,
// после него; в метрики качества дизайн-ревью не входит
const qas=DATA.findings.filter(f=>f.kind==='qa');
// Перепроверка исправлений (recheck.mjs): «Не исправлено» — что осталось и новые поломки, «Исправлено» — подтвердить;
// кадры «было | сейчас | макет»; статус и исходная находка — на карточке
const RECHECK=DATA.meta.mode==='recheck',fixedL=DATA.findings.filter(f=>f.kind==='fixed');
const RC_ST={new:'Новая поломка',regression:'Новая поломка',partial:'Исправлено не до конца','not-fixed':'Не исправлено',look:'Проверить глазами',eyes:'Проверить глазами',question:'Вопрос дизайнеру',fixed:'Исправлено',kept:'Без изменений (Допустимо)'};
const FIX_V=[['ok','Подтверждаю','1'],['bug','Не исправлено','2']];
// «Другой функционал» — расхождения не по задаче этого ревью (чипы навыков в старой карточке): отдельная вкладка, вне задач и метрик
const isOther=f=>decisions[f.id]?.v==='scope',mainBugs=()=>bugs.filter(f=>!isOther(f)),others=()=>bugs.filter(isOther);
const QA_V=[['bug','Баг','1'],['notbug','Не баг','2'],['discuss','Обсудить','4']];
const optsOf=f=>f.kind==='bug'?BUG_V:f.kind==='mockup'?MK_V:f.kind==='qa'?QA_V:f.kind==='fixed'?FIX_V:IMP_V;
// всё, что стоит поправить в макете: проверка макета (кроме «Не важно») + расхождения, где дизайнер решил «Ошибка в макете»
const mockupFixes=()=>[...bugs.filter(f=>decisions[f.id]?.v==='mockup'),...mocks.filter(f=>decisions[f.id]?.v!=='skip')];

function header(){
  $('#h1').textContent='Дизайн-ревью · '+DATA.meta.title;
  const link=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);
  if(PAGES){$('#sub').innerHTML=`Страниц: ${PAGES.length} — ${PAGES.map(p=>`${esc(p.title)} (${p.figmaUrl?link(p.figmaUrl,L.a):''}${p.figmaUrl&&p.testUrl?' ↔ ':''}${p.testUrl?link(p.testUrl,L.b):''})`).join(' · ')} · ${esc(DATA.meta.createdAt)}`;summary();return}
  $('#sub').innerHTML=`${link(DATA.meta.figmaUrl,DATA.meta.labels?L.a+(DATA.meta.figmaUrl?' · '+DATA.meta.figmaUrl:''):'макет в Figma')} ↔ ${link(DATA.meta.testUrl,DATA.meta.labels?L.b+(DATA.meta.testUrl?' · '+DATA.meta.testUrl:''):DATA.meta.testUrl)} · ${esc(DATA.meta.state)} · ${esc(DATA.meta.createdAt)}`;
  summary();
}
// Сводка: три блока построчно — находки по важности, разрешения (от большего к меньшему), качество навыка.
function summary(){
  const c=s=>mainBugs().filter(f=>f.severity===s).length,row=(l,v,cls='',t='')=>`<div class="srow ${cls}"${t?` title="${esc(t)}"`:''}><span>${l}</span><b>${v}</b></div>`;

// Порядок, удобный для перепроверки и правки: страница → блок (area) сверху вниз → элемент (element) → положение.
// Положение — верх первого кадра сайта; f.order (если задан агентом) важнее.
// Положение — по кадру самой широкой ширины (кадры 320 и 1200 по высоте не сравнимы)
const yOf=f=>{if(f.order!=null)return f.order;const ev=(f.evidence||[]).filter(e=>e.b);if(!ev.length)return 1e9;const w=e=>shotInfo(e.shot)?.w||0,top=ev.reduce((a,e)=>w(e)>w(a)?e:a);return top.b[1]};
// byPage: в списке находок — сначала страница (удобно с фильтром), в «Отчёте» — блоки по всей странице (страницы-состояния
// одной страницы — один блок)
function ordered(list,byPage=true){
  const pi=f=>byPage&&PAGES?Math.max(0,PAGES.findIndex(p=>p.id===f.page)):0,ka=f=>pi(f)+'|'+(f.area||''),ke=f=>ka(f)+'|'+(f.element||'');
  // Если агент разложил блоки (area) — порядок блоков и элементов как в findings.json (агент кладёт их сверху вниз:
  // координаты модалок и экранных кадров с полной страницей не сравнимы). Без area — по положению на странице.
  const idx=new Map(DATA.findings.map((f,i)=>[f.id,i])),hasArea=list.some(f=>f.area);
  const ay=new Map(),ey=new Map(),rank=f=>hasArea?idx.get(f.id)??1e9:yOf(f);
  for(const f of list){ay.set(ka(f),Math.min(ay.get(ka(f))??1e9,rank(f)));ey.set(ke(f),Math.min(ey.get(ke(f))??1e9,rank(f)))}
  return [...list].sort((a,b)=>pi(a)-pi(b)||(ay.get(ka(a))-ay.get(ka(b)))||(ey.get(ke(a))-ey.get(ke(b)))||rank(a)-rank(b)||yOf(a)-yOf(b));
}

  const html=shown.map(f=>{const k=(RECHECK?'':f.page||'')+'|'+(f.area||'');const head=f.area&&k!==prev?`<h2 class="rarea">${PAGES&&f.page&&!RECHECK?esc(pageTitle(f.page))+' · ':''}${esc(f.area)}</h2>`:'';prev=k;return head+cardHTML(f)}).join('');

// --- Jira: ссылки прямо на место проблемы и картинки «сайт | макет» (слева сайт, справа макет — как привычно разработчику)
// Текст в разметке Jira (wiki) — для старых Jira/YouTrack; «с картинками» — HTML с таблицей картинок: вставляется в Jira Cloud,
// Confluence, YouTrack, почту. Если редактор не принял картинки из HTML — «Копировать картинку» и вставить Ctrl+V.
// слой внутри экземпляра («I…;…») по ссылке открывает файл, а не место — берём node.link или корень экземпляра
const figUrl=(node,m=DATA.meta)=>{const raw=node&&(node.link||node.id||node),id=raw&&String(raw).startsWith('I')?String(raw).slice(1).split(';')[0]:raw;return id&&m.figmaUrl?m.figmaUrl.split('?')[0]+'?node-id='+encodeURIComponent(String(id).replace(/:/g,'-')):''};
const frag=ev=>ev?.textHint?'#:~:text='+encodeURIComponent(ev.textHint):''; // прокрутка к тексту и подсветка (Chrome, Edge, Яндекс)
const bUrl=ev=>{const m=metaOf(ev);return m.testUrl?m.testUrl.split('#')[0]+frag(ev):''};

// (картинки, подписи-ссылки, под ними значения); «Где:» и CSS. Без важности/ширин/категории и пересказа, как считали.
// Подробности (why) остаются в отчёте. Агент может задать f.short — одно предложение для задачи.
// Разметка в значениях и short: [[ok:…]] — верное (макет; жирный зелёный), [[bad:…]] — неверное (сайт; жирный красный),
// [[b:…]] — жирный. Без разметки в таблице «Сайт | Макет» числа подсвечиваются сами: на сайте красным, в макете зелёным.

const mMD=t=>String(t??'').replace(MKUP,(_,k,x)=>`**${x}**`);

const autoMark=(t,k)=>MKUP.test(t=String(t??''))?(MKUP.lastIndex=0,t):t.replace(/-?\d+(?:[.,]\d+)?(?:\s?(?:px|%|pt|×\d+))?/g,m=>`[[${k}:${m}]]`);

// Значения — одной строкой на сторону: «На 768 px: ширина 720 px, на 320 px: ширина 272 px» | «…» (образец дизайнера).
// f.values {b, a} — готовые строки (агент пишет сам, с разметкой); иначе — из props.
// Значения — в ячейке под ссылкой «Сайт»/«Макет», каждое с новой строки (образец дизайнера, COURSES-2092):
// «На 768 px: ширина 720 px» / «Отступ слева 24 px». Цветом — только расходящееся значение (последнее число строки):
// на сайте красным, в макете зелёным; совпадающее — просто жирным. Разметка [[ok:]]/[[bad:]]/[[b:]] агента важнее.
const LASTNUM=/(-?\d+(?:[.,]\d+)?(?:\s?(?:px|%|pt))?)(?!.*\d)/;
