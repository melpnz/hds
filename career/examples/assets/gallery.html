<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Каталог ассетов</title>
  <link rel="stylesheet" href="../foundations/foundation.css">
  <style>
    .toolbar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:12px 0;background:var(--color-ui-white)}
    input{width:min(420px,100%);height:40px;padding:0 12px;border:1px solid var(--color-ui-gray-5);border-radius:12px;font:inherit}
    .summary{color:var(--color-font-gray);font-size:12px}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .asset{min-width:0;padding:10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--color-ui-gray-shadow)}
    .asset__preview{display:grid;height:112px;margin-bottom:9px;place-items:center;overflow:hidden;border-radius:8px;background:var(--color-ui-gray-7)}
    .asset__preview img,.asset__preview svg{display:block;max-width:100%;max-height:100%;object-fit:contain}.asset__preview svg{width:48px;height:48px}.asset code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .asset small{display:block;margin-top:4px;color:var(--color-font-gray)}.file{font-size:12px;color:var(--color-font-gray)}
  </style>
</head>
<body>
  <main class="sheet">
    <div class="toolbar"><input id="filter" type="search" placeholder="Фильтр по имени или папке" aria-label="Фильтр ассетов"><span class="summary" id="summary"></span></div>
    <div id="catalog"></div>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const inventoryPath=params.get('inventory');const requestedTitle=params.get('title');
    const escapeHtml=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    if(requestedTitle)document.title=requestedTitle;
    fetch(`../../${inventoryPath}`).then(response=>response.json()).then(inventory=>{
      const render=query=>{const needle=query.trim().toLowerCase();const visible=inventory.assets.filter(item=>`${item.name} ${item.group} ${item.type}`.toLowerCase().includes(needle));const groups=visible.reduce((result,item)=>{(result[item.group]??=[]).push(item);return result},{});
        document.querySelector('#catalog').innerHTML=Object.entries(groups).map(([group,items])=>`<section class="group"><h2>${escapeHtml(group)} · ${items.length}</h2><div class="assets">${items.map(item=>`<article class="asset" title="${escapeHtml(item.path)}"><div class="asset__preview">${!item.previewable?`<span class="file">sprite-файл</span>`:item.type==='svg'?`<span class="inline-svg" data-src="../../${encodeURI(item.path)}"></span>`:`<img loading="lazy" src="../../${encodeURI(item.path)}" alt="">`}</div><code>${escapeHtml(item.name)}</code><small>${escapeHtml(item.type)}</small></article>`).join('')}</div></section>`).join('');document.querySelectorAll('.inline-svg[data-src]').forEach(slot=>fetch(slot.dataset.src).then(response=>response.text()).then(svg=>{slot.innerHTML=svg}).catch(()=>{slot.textContent='×'}));document.querySelector('#summary').textContent=`${visible.length} из ${inventory.total}`};
      document.querySelector('#filter').addEventListener('input',event=>render(event.target.value));render('');
    }).catch(error=>{document.querySelector('#catalog').textContent=`Не удалось загрузить каталог: ${error.message}`});
  </script>
</body>
</html>
