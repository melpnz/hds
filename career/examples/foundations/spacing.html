<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Интервалы</title><link rel="stylesheet" href="foundation.css"><style>.bar{height:20px;background:var(--color-ui-primary);border-radius:8px}.secondary .bar{background:var(--color-ui-primary-light)}.local .bar{background:var(--color-ui-gray-4)}</style></head><body><main class="sheet"><section class="group"><h2>Основной шаг</h2><div class="row" id="primary"></div></section><section class="group secondary"><h2>Дополнительные значения</h2><div class="row" id="secondary"></div></section><section class="group local"><h2>Только локальные значения</h2><div class="row" id="local"></div></section></main><script>for(const [id,values] of Object.entries({primary:[4,8,12,16,24],secondary:[2,32,48],local:[6,10,20,44]})){document.querySelector('#'+id).innerHTML=values.map(v=>`<span class="sample"><span class="bar" style="width:${Math.max(4,v)*4}px"></span><code>${v}px</code></span>`).join('')}</script></body></html>
