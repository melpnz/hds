<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Тени</title>
  <link rel="stylesheet" href="foundation.css">
  <style>.tokens{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.token{display:grid;gap:10px}.shape{height:92px;border-radius:12px;background:#fff;display:grid;place-items:center}.meta{display:grid;gap:3px;color:var(--color-font-gray);font-size:12px}.meta code{white-space:normal;overflow-wrap:anywhere}</style>
</head>
<body>
  <main class="sheet"><section class="group"><h2>Все токены shadow</h2><div class="tokens" id="tokens"></div></section></main>
  <script>
    const escapeHtml=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    fetch('../../machine/tokens/shadow.json').then(response=>response.json()).then(group=>{
      document.querySelector('#tokens').innerHTML=Object.entries(group.tokens).map(([name,token])=>{
        const cssVar=token.$extensions?.guide?.cssVar;
        const isShadow=name==='dropdown';
        const style=isShadow?`box-shadow:var(${cssVar})`:`border:4px solid var(${cssVar})`;
        return `<article class="token"><div class="shape" style="${style}">${isShadow?'floating layer':'border color'}</div><div class="meta"><b>${escapeHtml(name)}</b><code>${escapeHtml(cssVar||'')}</code><code>${escapeHtml(token.$value)}</code></div></article>`;
      }).join('');
    });
  </script>
</body>
</html>
