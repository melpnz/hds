<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../ui/career-slice.css"><style>.is-focus-demo{outline:2px solid var(--color-ui-primary-60);outline-offset:2px}.spinner{width:16px;height:16px;border:2px solid var(--color-ui-white-60);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}</style></head>
<body><main class="specimen">
  <div class="specimen-row"><span class="specimen-label">default</span><button class="base-button inline-flex appearance-main size-l is-sizeable"><span class="base-button__content">Откликнуться</span></button></div>
  <div class="specimen-row"><span class="specimen-label">focus-visible · демонстрация</span><button class="base-button inline-flex appearance-main size-l is-sizeable is-focus-demo"><span class="base-button__content">Откликнуться</span></button></div>
  <div class="specimen-row"><span class="specimen-label">pressed · contract class</span><button class="base-button inline-flex appearance-main size-l is-sizeable is-pressed"><span class="base-button__content">Откликнуться</span></button></div>
  <div class="specimen-row"><span class="specimen-label">disabled</span><button disabled class="base-button inline-flex appearance-main size-l is-sizeable"><span class="base-button__content">Откликнуться</span></button></div>
  <div class="specimen-row"><span class="specimen-label">loading</span><button id="loading" aria-busy="true" class="base-button inline-flex appearance-main size-l is-sizeable is-loading"><span class="base-button__inner is-hidden"><span class="base-button__content">Откликнуться</span></span><span class="base-button__loader"><span class="spinner"></span></span></button><button id="toggle" class="base-button inline-flex appearance-passive size-sm is-sizeable"><span class="base-button__content">Переключить</span></button></div>
</main><script src="toggle-loading.js"></script></body>
</html>
