<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../ui/career-slice.css"></head>
<body><main class="specimen">
  <div class="specimen-label">Основные</div>
  <div class="specimen-row">
    <button class="base-button inline-flex appearance-main size-l is-sizeable"><span class="base-button__content">Откликнуться</span></button>
    <button class="base-button inline-flex appearance-main-border size-l is-sizeable"><span class="base-button__content">Сохранить</span></button>
    <button class="base-button inline-flex appearance-passive size-l is-sizeable"><span class="base-button__content">Отмена</span></button>
  </div>
  <div class="specimen-label">Статусные</div>
  <div class="specimen-row">
    <button class="base-button inline-flex appearance-danger size-l is-sizeable"><span class="base-button__content">Удалить</span></button>
    <button class="base-button inline-flex appearance-danger-border size-l is-sizeable"><span class="base-button__content">Удалить</span></button>
    <button class="base-button inline-flex appearance-success size-l is-sizeable"><span class="base-button__content">Готово</span></button>
    <button class="base-button inline-flex appearance-success-border size-l is-sizeable"><span class="base-button__content">Подтвердить</span></button>
  </div>
  <div class="specimen-label">Служебные</div>
  <div class="specimen-row">
    <button class="base-button inline-flex appearance-ghost size-l is-sizeable"><span class="base-button__content">Позже</span></button>
    <button class="base-button inline-flex appearance-menu size-l is-sizeable"><span class="base-button__content">Настройки</span></button>
    <button class="base-button inline-flex appearance-avatar size-l is-sizeable"><span class="base-button__content">Avatar</span></button>
  </div>
  <div class="specimen-label">Branded · демонстрационные runtime-цвета</div>
  <div class="specimen-row" style="--color-branded-profile-primary:#155eef;--color-branded-profile-text-primary:#fff">
    <button class="base-button inline-flex appearance-branded size-l is-sizeable"><span class="base-button__content">Написать</span></button>
    <button class="base-button inline-flex appearance-branded-outline size-l is-sizeable"><span class="base-button__content">Компания</span></button>
    <button class="base-button inline-flex appearance-branded-secondary-outline size-l is-sizeable"><span class="base-button__content">Подробнее</span></button>
  </div>
</main></body>
</html>
