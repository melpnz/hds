<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
    <style>
      .spinner { transform-origin: 25px 25px; animation: spinner-rotate 2s linear infinite }
      .spinner circle {
        fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round;
        stroke-dasharray: 1 200; stroke-dashoffset: 0;
        animation: spinner-dash 1.5s ease-in-out infinite;
      }
      @keyframes spinner-rotate { to { transform: rotate(360deg) } }
      @keyframes spinner-dash {
        0%   { stroke-dasharray: 1 200;  stroke-dashoffset: 0 }
        50%  { stroke-dasharray: 89 200; stroke-dashoffset: -35 }
        100% { stroke-dasharray: 89 200; stroke-dashoffset: -124 }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 6s }
        .spinner circle { animation: none; stroke-dasharray: 89 200 }
      }
    </style>
    <g class="spinner"><circle cx="25" cy="25" r="20"/></g>
  </svg>