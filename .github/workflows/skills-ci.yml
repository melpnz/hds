name: Skills
on:
  push:
    paths: ['skills/**', 'tools/*skill*.mjs', '.github/workflows/skills-ci.yml']
  pull_request:
    paths: ['skills/**', 'tools/*skill*.mjs', '.github/workflows/skills-ci.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-skills.mjs
      - run: node tools/test-skill-publication.mjs
      - run: node skills/habr-design-review/tests/updates-test.mjs
  report-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: skills/habr-design-review
      - run: npx playwright install --with-deps chromium
        working-directory: skills/habr-design-review
      - run: node tests/report-ui-test.mjs
        working-directory: skills/habr-design-review
      - run: node tests/details-test.mjs
        working-directory: skills/habr-design-review
