name: Courses guide and Nuxt Kit

on:
  push:
    paths:
      - 'courses/**'
      - '.github/workflows/courses-ci.yml'
  pull_request:
    paths:
      - 'courses/**'
      - '.github/workflows/courses-ci.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      release_catalog:
        type: boolean
        default: false

concurrency:
  group: courses-ci-${{ inputs.source_ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts, build and copied consumer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/package-lock.json
      - name: Install guide dependencies
        working-directory: courses
        run: npm ci
      - name: Validate guide, provider mappings and compatibility
        working-directory: courses
        run: npm run validate
      - name: Install Nuxt Kit dependencies
        working-directory: courses/courses-nuxt-kit
        run: pnpm install --frozen-lockfile
      - name: Check component, API, token and manifest drift
        working-directory: courses/courses-nuxt-kit
        run: pnpm run check
      - name: Typecheck and build Nuxt Kit
        working-directory: courses/courses-nuxt-kit
        run: pnpm run typecheck && pnpm run build
      - name: Build an offline minimal consumer from the copied layer
        working-directory: courses/courses-nuxt-kit
        run: pnpm run test:consumer

  render-smoke:
    name: Viewer and provider render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install guide and Nuxt Kit dependencies
        run: |
          npm ci --prefix courses
          pnpm --dir courses/courses-nuxt-kit install --frozen-lockfile
      - name: Install Chromium
        working-directory: courses/courses-nuxt-kit
        run: pnpm exec playwright install --with-deps chromium
      - name: Start guide and provider
        shell: bash
        run: |
          npm --prefix courses run serve -- 4181 > courses-guide.log 2>&1 &
          echo $! > courses-guide.pid
          pnpm --dir courses/courses-nuxt-kit dev --host 127.0.0.1 --port 3002 > courses-provider.log 2>&1 &
          echo $! > courses-provider.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:4181/viewer/ > /dev/null && curl --fail --silent http://127.0.0.1:3002/ui > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Courses servers did not become ready in time.'
          exit 1
      - name: Validate all guide previews
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm --prefix courses run validate:viewer -- http://127.0.0.1:4181
      - name: Validate responsive production reference atlas offline
        run: npm --prefix courses run validate:page-atlas -- http://127.0.0.1:4181
      - name: Validate integrated provider previews
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm --prefix courses run validate:integrated-viewer -- http://127.0.0.1:4181
      - name: Run Nuxt catalog smoke tests
        working-directory: courses/courses-nuxt-kit
        run: pnpm run test:smoke
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: courses-render-smoke-logs
          path: |
            courses-guide.log
            courses-provider.log
            courses/courses-nuxt-kit/test-results
            courses/machine/reports/page-atlas-validation.json
            .audits/courses-atlas-validation
          if-no-files-found: ignore
          retention-days: 3

  visual-regression:
    name: Priority visual regression (pinned Chromium)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Nuxt Kit dependencies
        working-directory: courses/courses-nuxt-kit
        run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        working-directory: courses/courses-nuxt-kit
        run: pnpm exec playwright install chromium
      - name: Generate production static preview
        working-directory: courses/courses-nuxt-kit
        run: pnpm run generate
      - name: Check production mechanics, catalog and approved screenshots
        working-directory: courses/courses-nuxt-kit
        env:
          PLAYWRIGHT_CHANNEL: chromium
          COURSES_TEST_STATIC: '1'
        run: pnpm exec playwright test tests/e2e/roadmap-regressions.spec.ts tests/e2e/catalog.spec.ts tests/e2e/visual.spec.ts
      - name: Save tested static catalog for draft release
        if: inputs.release_catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courses-release-catalog-${{ github.run_id }}
          path: courses/courses-nuxt-kit/.output/public
          if-no-files-found: error
          retention-days: 3
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: courses-visual-regression
          path: |
            courses/courses-nuxt-kit/test-results
            courses/courses-nuxt-kit/playwright-report
          if-no-files-found: ignore
          retention-days: 3
