<!doctype html><html lang="ru" data-theme="company"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../ui/hds.css"><link rel="stylesheet" href="../example.css"><title>Текстовое поле</title></head><body><main class="demo-page"><section class="demo-section"><header><p>Элементы</p><h1>Текстовое поле</h1><p>Интерактивное поле поддерживает pointer-focus и отдельный клавиатурный контур.</p></header><div class="demo-playground"><label class="hds-field"><span>Имя</span><input autocomplete="name" placeholder="Как к вам обращаться"></label></div></section><section class="demo-section"><header><h2>Состояния</h2></header><div class="demo-states"><article class="demo-state"><span class="demo-state__label">Default</span><input placeholder="Введите значение"></article><article class="demo-state" data-demo-state="hover"><span class="demo-state__label">Hover</span><input placeholder="Введите значение"></article><article class="demo-state" data-demo-state="focus"><span class="demo-state__label">Keyboard focus</span><input value="Текст"></article><article class="demo-state"><span class="demo-state__label">Filled</span><input value="Алексей"></article><article class="demo-state"><span class="demo-state__label">Error</span><label class="hds-field"><input value="example@" aria-invalid="true" aria-describedby="email-error"><small class="hds-field__error" id="email-error">Проверьте адрес почты</small></label></article><article class="demo-state"><span class="demo-state__label">Disabled</span><input value="Недоступно" disabled></article></div></section></main><script src="../../ui/hds.js"></script></body></html>
