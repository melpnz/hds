<!doctype html>
<html lang="ru" data-theme="company">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../ui/hds.css">
  <link rel="stylesheet" href="../example.css">
  <title>Компактное действие</title>
</head>
<body>
  <main class="demo-page">
    <section class="demo-section">
      <header>
        <p>Элементы</p>
        <h1>Компактное действие</h1>
        <p>Небольшая ссылка-действие для карточек и списков. Не заменяет основную кнопку.</p>
      </header>
      <div class="demo-playground hds-cluster">
        <a class="hds-compact-action" href="#states">Блог LampTest <span aria-hidden="true">↗</span></a>
      </div>
    </section>
    <section class="demo-section" id="states">
      <header><h2>Состояния</h2></header>
      <div class="demo-states">
        <article class="demo-state"><span class="demo-state__label">Default</span><a class="hds-compact-action" href="#states">Блог LampTest <span aria-hidden="true">↗</span></a></article>
        <article class="demo-state" data-demo-state="hover"><span class="demo-state__label">Hover</span><a class="hds-compact-action" href="#states">Блог LampTest <span aria-hidden="true">↗</span></a></article>
        <article class="demo-state" data-demo-state="focus"><span class="demo-state__label">Keyboard focus</span><a class="hds-compact-action" href="#states">Блог LampTest <span aria-hidden="true">↗</span></a></article>
        <article class="demo-state"><span class="demo-state__label">Disabled</span><a class="hds-compact-action" aria-disabled="true">Блог LampTest <span aria-hidden="true">↗</span></a></article>
      </div>
    </section>
  </main>
</body>
</html>
