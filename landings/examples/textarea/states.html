<!doctype html><html lang="ru" data-theme="company"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../ui/hds.css"><link rel="stylesheet" href="../example.css"><title>Многострочное поле</title></head><body><main class="demo-page"><section class="demo-section"><header><p>Элементы</p><h1>Многострочное поле</h1></header><div class="demo-playground"><label class="hds-field"><span>Расскажите о задаче</span><textarea placeholder="Несколько предложений"></textarea></label></div></section><section class="demo-section"><header><h2>Состояния</h2></header><div class="demo-states"><article class="demo-state"><span class="demo-state__label">Default</span><textarea placeholder="Введите сообщение"></textarea></article><article class="demo-state" data-demo-state="hover"><span class="demo-state__label">Hover</span><textarea placeholder="Введите сообщение"></textarea></article><article class="demo-state" data-demo-state="focus"><span class="demo-state__label">Keyboard focus</span><textarea>Текст сообщения</textarea></article><article class="demo-state"><span class="demo-state__label">Error</span><label class="hds-field"><textarea aria-invalid="true" aria-describedby="message-error">Слишком коротко</textarea><small class="hds-field__error" id="message-error">Опишите задачу подробнее</small></label></article><article class="demo-state"><span class="demo-state__label">Disabled</span><textarea disabled>Недоступно</textarea></article></div></section></main><script src="../../ui/hds.js"></script></body></html>
