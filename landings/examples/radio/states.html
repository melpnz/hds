<!doctype html><html lang="ru" data-theme="company"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../ui/hds.css"><link rel="stylesheet" href="../example.css"><title>Радиокнопка</title></head><body><main class="demo-page"><section class="demo-section"><header><p>Элементы</p><h1>Радиокнопка</h1></header><div class="demo-playground hds-stack"><label class="hds-radio"><input type="radio" name="live" checked><span>Базовая программа</span></label><label class="hds-radio"><input type="radio" name="live"><span>Продвинутая программа</span></label></div></section><section class="demo-section"><header><h2>Состояния</h2></header><div class="demo-states"><article class="demo-state"><span class="demo-state__label">Default</span><label class="hds-radio"><input type="radio"><span>Вариант</span></label></article><article class="demo-state" data-demo-state="checked"><span class="demo-state__label">Selected</span><label class="hds-radio"><input type="radio"><span>Выбранный вариант</span></label></article><article class="demo-state" data-demo-state="focus"><span class="demo-state__label">Keyboard focus</span><label class="hds-radio"><input type="radio"><span>Вариант</span></label></article><article class="demo-state"><span class="demo-state__label">Disabled</span><label class="hds-radio"><input type="radio" disabled><span>Недоступно</span></label></article></div></section></main><script src="../../ui/hds.js"></script></body></html>
