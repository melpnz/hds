<!doctype html>
<html lang="ru" data-theme="company">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../ui/hds.css">
  <link rel="stylesheet" href="../example.css">
  <title>Форма заявки</title>
</head>
<body data-full-page>
  <section class="hds-contact hds-section">
    <div class="hds-container hds-contact__inner">
      <div><p class="hds-small hds-muted">Контакты</p><h2>Обсудим вашу задачу</h2></div>
      <form class="hds-form" data-hds-demo-form>
        <div class="hds-grid hds-grid--2">
          <label class="hds-field"><span>Имя и фамилия</span><input name="name" autocomplete="name" placeholder="Как к вам обращаться" required></label>
          <label class="hds-field"><span>Рабочая почта</span><input name="email" type="email" autocomplete="email" placeholder="name@company.ru" required></label>
          <label class="hds-field"><span>Название компании</span><input name="company" autocomplete="organization" placeholder="Компания"></label>
          <label class="hds-field"><span>Должность</span><input name="role" autocomplete="organization-title" placeholder="Ваша роль"></label>
          <label class="hds-field"><span>Телефон</span><input name="phone" type="tel" autocomplete="tel" placeholder="+7 999 000-00-00"></label>
          <label class="hds-field"><span>Сайт или мессенджер</span><input name="website" type="url" placeholder="https://"></label>
        </div>
        <fieldset class="hds-form__group" data-hds-optional>
          <legend>Тип запроса — опционально</legend>
          <div class="hds-form__options hds-form__options--inline">
            <label class="hds-radio"><input type="radio" name="request-type" value="project"><span>Новый проект</span></label>
            <label class="hds-radio"><input type="radio" name="request-type" value="consultation"><span>Консультация</span></label>
            <label class="hds-radio"><input type="radio" name="request-type" value="partnership"><span>Партнёрство</span></label>
          </div>
        </fieldset>
        <div class="hds-grid hds-grid--2" data-hds-optional>
          <div class="hds-field"><span>Планируемый бюджет</span><details class="hds-select" data-hds-select><summary><span data-hds-select-value>Выберите диапазон</span></summary><div class="hds-select__list" role="listbox" aria-label="Планируемый бюджет"><button type="button" class="hds-select__option" role="option" data-value="up-to-300">До 300 000 ₽</button><button type="button" class="hds-select__option" role="option" data-value="300-to-1000">300 000–1 000 000 ₽</button><button type="button" class="hds-select__option" role="option" data-value="over-1000">Более 1 000 000 ₽</button></div><input type="hidden" name="budget" data-hds-select-input></details></div>
          <div class="hds-field"><span>Срок запуска</span><details class="hds-select" data-hds-select><summary><span data-hds-select-value>Выберите срок</span></summary><div class="hds-select__list" role="listbox" aria-label="Срок запуска"><button type="button" class="hds-select__option" role="option" data-value="month">В течение месяца</button><button type="button" class="hds-select__option" role="option" data-value="quarter">1–3 месяца</button><button type="button" class="hds-select__option" role="option" data-value="unknown">Пока определяемся</button></div><input type="hidden" name="timeline" data-hds-select-input></details></div>
        </div>
        <fieldset class="hds-form__group" data-hds-optional>
          <legend>Интересующие форматы — опционально</legend>
          <div class="hds-form__options">
            <label class="hds-check"><input type="checkbox" name="formats" value="native"><span>Нативный проект</span></label>
            <label class="hds-check"><input type="checkbox" name="formats" value="media"><span>Медийная реклама</span></label>
            <label class="hds-check"><input type="checkbox" name="formats" value="career"><span>HR-спецпроект</span></label>
            <label class="hds-check"><input type="checkbox" name="formats" value="content"><span>Контент в блог</span></label>
          </div>
        </fieldset>
        <label class="hds-field"><span>О задаче</span><textarea name="message" placeholder="Расскажите, что хотите запустить"></textarea></label>
        <label class="hds-check"><input type="checkbox" required><span>Согласен с обработкой персональных данных</span></label>
        <div class="hds-form__actions"><button type="submit">Отправить</button><p class="hds-form__status" role="status" aria-live="polite"></p></div>
      </form>
    </div>
  </section>
  <script src="../../ui/hds.js"></script>
</body>
</html>
