<!doctype html><html lang="ru" data-theme="company"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поля ввода</title><link rel="stylesheet" href="../../../ui/hds.css"><link rel="stylesheet" href="../../example.css"></head><body><main class="demo-page"><header><p class="hds-small hds-muted">Коллекция</p><h1>Поля ввода</h1><p class="hds-muted">Текстовое и многострочное поле используют общие размеры, фокус и валидацию.</p></header><section class="demo-section"><h2>Текстовое поле</h2><div class="demo-playground"><label class="hds-field"><span>Имя</span><input autocomplete="name" placeholder="Как к вам обращаться"></label></div><div class="demo-states"><article class="demo-state"><span class="demo-state__label">Default</span><input placeholder="Введите значение"></article><article class="demo-state" data-demo-state="hover"><span class="demo-state__label">Hover</span><input placeholder="Введите значение"></article><article class="demo-state" data-demo-state="focus"><span class="demo-state__label">Keyboard focus</span><input value="Текст"></article><article class="demo-state"><span class="demo-state__label">Filled</span><input value="Алексей"></article><article class="demo-state"><span class="demo-state__label">Error</span><label class="hds-field"><input value="example@" aria-invalid="true" aria-describedby="input-email-error"><small class="hds-field__error" id="input-email-error">Проверьте адрес почты</small></label></article><article class="demo-state"><span class="demo-state__label">Disabled</span><input value="Недоступно" disabled></article></div></section><section class="demo-section"><h2>Многострочное поле</h2><div class="demo-playground"><label class="hds-field"><span>Расскажите о задаче</span><textarea placeholder="Несколько предложений"></textarea></label></div><div class="demo-states"><article class="demo-state"><span class="demo-state__label">Default</span><textarea placeholder="Введите сообщение"></textarea></article><article class="demo-state" data-demo-state="hover"><span class="demo-state__label">Hover</span><textarea placeholder="Введите сообщение"></textarea></article><article class="demo-state" data-demo-state="focus"><span class="demo-state__label">Keyboard focus</span><textarea>Текст сообщения</textarea></article><article class="demo-state"><span class="demo-state__label">Error</span><label class="hds-field"><textarea aria-invalid="true" aria-describedby="input-message-error">Слишком коротко</textarea><small class="hds-field__error" id="input-message-error">Опишите задачу подробнее</small></label></article><article class="demo-state"><span class="demo-state__label">Disabled</span><textarea disabled>Недоступно</textarea></article></div></section></main><script src="../../../ui/hds.js"></script></body></html>
