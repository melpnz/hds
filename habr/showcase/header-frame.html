<!doctype html>
<meta charset="utf-8">
<!-- Без этого meta мобильная эмуляция берёт layout viewport 980px, и ни один
     медиазапрос шапки не срабатывает: страница на 320 рендерится как десктоп.
     Ловушка уже ловилась в этом пакете один раз — на самой витрине. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header · adaptive frame</title>
<!--
  Отдельная страница ровно с одной шапкой. Встраивается в components.html
  через <iframe> заданной ширины — только так медиазапросы .tm-header
  срабатывают ПО-НАСТОЯЩЕМУ: у iframe собственный viewport, и 320px внутри
  него это настоящие 320px, а не имитация через transform/зум.

  Разметка снята с живого habr.com (структура и порядок узлов), инлайновых
  стилей нет: всё оформление приходит из ui/habr.css.
  Параметр ?feature=1 добавляет рекламный слот — он и объясняет, почему
  на мобильном полная высота 80px, а не 48.
-->
<link rel="stylesheet" href="../ui/themes/light-v2.css">
<link rel="stylesheet" href="../ui/habr.css">
<style>
  html, body { margin: 0; background: var(--background-gray); }
  /* тело кадра — чтобы было видно, что шапка липкая и что под ней контент */
  .frame-body { height: 96px; }
  .frame-note {
    font: 11px/1.4 ui-monospace, Consolas, monospace;
    color: #6b6b74; padding: 10px 16px;
  }
</style>

       Инлайн нужен потому, что по file:// браузер блокирует внешние

</svg>

<header class="tm-header tm-header_with-feature">
  <!-- Рекламный слот. Его МЕСТО В DOM зависит от ширины, и это делает не CSS,
       а сам продукт: на ≤767 он лежит здесь, соседом .tm-page-width, отдельной
       полосой над рядом навигации; на ≥768 переезжает ВНУТРЬ
       .tm-header__container. Проверено обходом живого DOM на 375 и 1440.
       Скрипт внизу повторяет этот перенос — двух копий узла в разметке нет. -->
  <div class="header-feature tm-header__feature" data-feature>
    <a class="link" href="#"><span class="icon"></span>Реклама на Хабре</a>
    <span class="adv">Реклама</span>
  </div>
  <div class="tm-page-width">
    <div class="tm-header__container">
      <button aria-expanded="false" aria-label="Меню" class="burger-button tm-header__button tm-header__burger" type="button">
        <span class="line top"></span>
        <span class="line middle"></span>
        <span class="line bottom"></span>
      </button>
      <span class="tm-header__logo-wrap">
        <a class="tm-header__logo tm-header__logo_hl-ru" href="#">
          <svg class="tm-svg-img tm-header__icon" height="16" width="16"><title>Хабр</title>
            <use xlink:href="#habr-logo"></use></svg>
        </a>
      </span>
      <span class="tm-header__divider"></span>
      <a class="tm-header__all-flows" href="#">Все потоки</a>

      <div class="tm-header-user-menu tm-header__user-menu">
        <a class="tm-header-user-menu__item tm-header-user-menu__search" href="#" aria-label="Поиск">
          <svg class="tm-svg-img tm-header-user-menu__icon" height="24" width="24"><title>Поиск</title>
            <use xlink:href="#search"></use></svg>
        </a>
        <div class="tm-header-user-menu__item tm-header-user-menu__write">
          <a href="#" aria-label="Написать">
            <svg class="tm-svg-img tm-header-user-menu__icon" height="24" width="24"><title>Написать</title>
              <use xlink:href="#pencil"></use></svg>
          </a>
        </div>
        <div class="tm-header-user-menu__item">
          <svg class="tm-svg-img tm-header-user-menu__icon" height="24" width="24"><title>Настройки</title>
            <use xlink:href="#page-settings"></use></svg>
        </div>
        <a class="tm-header-user-menu__item tm-header-user-menu__login" href="#">Войти</a>
      </div>
    </div>
  </div>
</header>

<div class="frame-body">
  <p class="frame-note" data-report>—</p>
</div>

<script>
  // рекламный слот выключается параметром ?feature=0
  var params = new URLSearchParams(location.search);
  if (params.get('feature') === '0') {
    document.querySelector('[data-feature]').remove();
    document.querySelector('.tm-header').classList.remove('tm-header_with-feature');
  }
  // Перенос слота между двумя позициями DOM — ровно то, что делает продукт.
  function placeFeature() {
    var f = document.querySelector('[data-feature]');
    if (!f) return;
    var header = document.querySelector('.tm-header');
    var container = document.querySelector('.tm-header__container');
    var desktop = matchMedia('(min-width: 768px)').matches;
    if (desktop) {
      var menu = container.querySelector('.tm-header-user-menu');
      if (f.parentNode !== container) container.insertBefore(f, menu);
    } else {
      if (f.parentNode !== header) header.insertBefore(f, header.firstElementChild);
    }
  }

  // подпись под шапкой: настоящие замеры этого кадра, а не переписанные цифры
  function report() {
    var h = document.querySelector('.tm-header');
    var c = document.querySelector('.tm-header__container');
    var d = document.querySelector('.tm-header__divider');
    var f = document.querySelector('.tm-header__all-flows');
    var vis = function (el) { return el && getComputedStyle(el).display !== 'none'; };
    document.querySelector('[data-report]').textContent =
      'viewport ' + document.documentElement.clientWidth + ' · ' +
      '.tm-header ' + Math.round(h.getBoundingClientRect().height) + 'px · ' +
      'container ' + Math.round(c.getBoundingClientRect().height) + 'px · ' +
      'padding ' + getComputedStyle(c).padding + ' · ' +
      'divider ' + (vis(d) ? 'есть' : 'скрыт') + ' · ' +
      '«Все потоки» ' + (vis(f) ? 'есть' : 'скрыт');
  }
  placeFeature();
  report();
  addEventListener('resize', function () { placeFeature(); report(); });
</script>
