<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-pages.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--page pattern-entity">

<div style="display:flex;gap:24px;max-width:900px">
<div style="flex:1;min-width:0">
<div class="tm-hub-card" style="border-radius:8px 8px 0 0">
<div class="tm-hub-card__header">
<div class="tm-hub-card__data">
<img alt="" class="tm-hub-card__avatar avatar-default avatar-default_hub" height="48" src="../../../../ui/assets/illustrations/avatars/avatar-default-hub.svg" width="48"/>
<div>
<h1 class="tm-hub-card__name">Искусственный интеллект</h1>
<div class="tm-hub-card__short-info">1 240 подписчиков</div>
</div>
</div>
<div style="display:flex;align-items:center;gap:4px">
<button class="btn btn_transparent btn_small tm-button_color-christi tm-button-follow" type="button">Подписаться</button>
</div>
</div>
<div class="tm-hub-card__description">AI, ANN и иные формы искусственного разума.</div>
<div class="stats-container">
<span class="stat">★ 4.6 рейтинг</span>
<span class="stat">312 статей</span>
</div>
</div>
<div class="tabs" style="margin:16px 0">
<div class="tabs-scroll-area"><div class="tabs-padding-area">
<span class="tab-item"><button class="active tab-link" type="button">Публикации</button></span>
<span class="tab-item"><button class="tab-link" type="button">Авторы</button></span>
</div></div>
</div>
<div style="background:var(--background-primary);padding:16px;border-radius:8px;color:var(--text-secondary);font-size:.8125rem"></div>
</div>
<div style="width:260px;flex:none">
<div class="tm-block" style="border-radius:8px;border:1px solid var(--icon-secondary)">
<div class="tm-block__header"><div class="tm-block__header-container">
<span class="tm-block__title">О хабе</span>
</div></div>
<div class="tm-block__body tm-block__body_variant-condensed">
<div class="tm-description-list_variant-columns-info">
<div class="tm-description-list__title_variant-columns-info">Создан</div>
<div class="tm-description-list__body_variant-columns-info">2019</div>
</div>
<div class="tm-description-list_variant-columns-info">
<div class="tm-description-list__title_variant-columns-info">Куратор</div>
<div class="tm-description-list__body_variant-columns-info">admin</div>
</div>
</div>
</div>
<div class="badges" style="margin-top:16px">
<ul class="list">
<li class="item"><a class="badge" href="../../../../ui/assets/icons/megazord.svg#entity" title="10 лет на Хабре">10 лет <svg class="badge-icon" height="16" width="16"></svg></a></li>
</ul>
</div>
</div>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
