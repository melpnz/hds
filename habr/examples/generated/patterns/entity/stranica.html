<!doctype html>
<html lang="ru">
<head>

  <title>Страница</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">

<body class="migration-example migration-example--page pattern-entity">
<habr-site-header></habr-site-header>
<main class="tm-page page-example"><div class="tm-page-width">
<div class="tm-page__wrapper">
<section class="tm-page__main tm-page__main_has-sidebar">
<div class="tm-hub-card">
<div class="tm-hub-card__header">
<div class="tm-hub-card__data">

<h1 class="tm-hub-card__name">Искусственный интеллект</h1>

</div>
</div>
<div class="page-example__actions">
<button class="btn btn_transparent btn_small tm-button_color-christi tm-button-follow" type="button">Подписаться</button>

</div>
<div class="tm-hub-card__description">AI, ANN и иные формы искусственного разума.</div>
<div class="stats-container">
<span class="stat">★ 4.6 рейтинг</span>

<div class="tm-description-list__body_variant-columns-info">2019</div>
</div>
<div class="tm-description-list_variant-columns-info">
<div class="tm-description-list__title_variant-columns-info">Куратор</div>
<div class="tm-description-list__body_variant-columns-info">admin</div>
</div>
</div>
</div>
<div class="badges page-example__badges">
<ul class="list">
<li class="item"><a class="badge" href="../../../../ui/assets/icons/megazord.svg#entity" title="10 лет на Хабре">10 лет <svg class="badge-icon" height="16" width="16"></svg></a></li>

<script src="../../../../examples/components.js"></script>
