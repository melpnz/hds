<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-pages.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--page pattern-shell">

<div class="tm-header" style="position:static">
<div class="tm-header__container tm-page-width" style="max-width:820px;justify-content:space-between">
<div style="display:flex;align-items:center;gap:20px">
<svg class="tm-svg-img" height="24" style="color:var(--header-text)" width="86"><use xlink:href="../../../../ui/assets/icons/megazord.svg#header-burger"></use></svg>
<span style="font-weight:700;color:var(--header-text)">Хабр</span>
</div>
<div style="display:flex;align-items:center;gap:16px">
<svg class="tm-svg-img" height="20" style="color:var(--header-text)" width="20"><use xlink:href="../../../../ui/assets/icons/megazord.svg#search"></use></svg>
<svg class="tm-svg-img" height="20" style="color:var(--header-text)" width="20"><use xlink:href="../../../../ui/assets/icons/megazord.svg#write"></use></svg>
</div>
</div>
</div>

<div style="padding:16px">
<div class="tm-page-width" style="max-width:820px;border:1px dashed var(--icon-secondary)">
<div class="tm-page__wrapper">
<div class="tm-page__main tm-page__main_has-sidebar" style="padding:16px;background:var(--background-primary)"></div>
<div class="tm-page__sidebar" style="padding:16px;background:var(--background-primary);margin-left:8px"></div>
</div>
</div>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
