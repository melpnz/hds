<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки профиля</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-pages.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
  <script src="../../../../examples/site-shell.js" defer></script>
</head>
<body class="migration-example migration-example--page pattern-settings-forms">
<habr-site-header></habr-site-header>
<main class="tm-page page-example"><div class="tm-page-width"><div class="tm-page__wrapper">
<section class="tm-page__main"><section class="settings-page__header"><h1 class="tm-title tm-title_h1">Настройки</h1><div class="tabs"><div class="tabs-scroll-area"><div class="tabs-padding-area"><span class="tab-item"><button class="active tab-link" type="button">Профиль</button></span><span class="tab-item"><button class="tab-link" type="button">Специализация</button></span><span class="tab-item"><button class="tab-link" type="button">Аккаунт</button></span><span class="tab-item"><button class="tab-link" type="button">Приватность</button></span><span class="tab-item"><button class="tab-link" type="button">Уведомления</button></span></div></div></div></section>
<form class="settings-page__grid"><div><section class="settings-page__group"><label class="settings-page__label">Настоящее имя<input class="tm-input-text-decorated__input" type="text" value="Вася Пупкин" placeholder=""></label><label class="settings-page__label">Место работы<input class="tm-input-text-decorated__input" type="text" value="" placeholder=""></label><button class="btn btn_transparent btn_small" type="button">Добавить место работы</button></section><section class="settings-page__group"><label class="settings-page__label">Специализация<input class="tm-input-text-decorated__input" type="text" value="Программист всех руси" placeholder=""></label><div class="settings-page__fields"><label class="settings-page__label">Пол<input class="tm-input-text-decorated__input" type="text" value="Мужской" placeholder=""></label><label class="settings-page__label">Дата рождения<input class="tm-input-text-decorated__input" type="text" value="19 марта" placeholder=""></label><label class="settings-page__label">Год<input class="tm-input-text-decorated__input" type="text" value="1989" placeholder=""></label></div><label class="settings-page__label">Местоположение<input class="tm-input-text-decorated__input" type="text" value="Россия · Московская обл. · Москва" placeholder=""></label></section><section class="settings-page__group"><h2>Контактная информация и веб-ресурсы</h2><label class="settings-page__label">Сайт<input class="tm-input-text-decorated__input" type="text" value="https://habr.com/ru/auth/settings/profile/" placeholder=""></label><div class="settings-page__fields"><label class="settings-page__label">Хабр Карма<input class="tm-input-text-decorated__input" type="text" value="melpnz" placeholder=""></label><label class="settings-page__label">Ссылка<input class="tm-input-text-decorated__input" type="text" value="https://example.com" placeholder=""></label></div><button class="btn btn_transparent btn_small" type="button">Добавить ссылку</button></section><section class="settings-page__group"><h2>Донаты</h2><div class="tm-notice tm-notice_info settings-page__notice"><div class="tm-notice__inner"><div class="tm-notice__content">Укажите данные кошельков или подключите сервис для получения вознаграждений.</div></div></div><label class="settings-page__label">Кошелёк<input class="tm-input-text-decorated__input" type="text" value="YooMoney" placeholder=""></label><div class="settings-page__fields"><label class="settings-page__label">Сервис<input class="tm-input-text-decorated__input" type="text" value="destream" placeholder=""></label><label class="settings-page__label">Username<input class="tm-input-text-decorated__input" type="text" value="Username-destreamdonate" placeholder=""></label></div></section><section class="settings-page__group"><label class="settings-page__label">Расскажите о себе<textarea class="tm-textarea-reconstructed" rows="6" placeholder=""></textarea></label><button class="btn btn_solid btn_middle tm-button_color-christi" type="submit">Сохранить изменения</button></section></div><aside class="settings-page__avatar"><strong>Аватар</strong><img class="avatar-default avatar-default_user" src="../../../../ui/assets/illustrations/avatars/avatar-default-user.svg" width="64" height="64" alt=""><a href="#">⟳ Загрузить аватарку</a><small>Формат: jpg, gif, png<br>Максимальный размер файла: 1Mb.</small><button class="btn btn_transparent btn_small" type="button">Загрузить</button></aside></form></section>
</div></div></main>
<habr-site-footer></habr-site-footer>
<script src="../../../../examples/components.js"></script>
</body>
</html>
