<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-pages.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--page pattern-admin-form">

<div style="max-width:820px">
<div style="background:var(--background-primary);padding:20px;border-radius:8px;margin-bottom:16px;font-weight:700">
        Заявка на корпоративный блог
      </div>
<div style="display:flex;gap:16px">
<div style="flex:1;background:var(--background-primary);padding:20px;border-radius:8px">
<h3 style="margin:0 0 16px">Реквизиты компании</h3>
<div style="margin-bottom:16px">
<label style="display:block;font-weight:600;font-size:.875rem;margin-bottom:8px">* Форма организации</label>
<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.875rem">
<input checked="" name="org" type="radio"/> Российское юрлицо (ООО, ОАО, ЗАО и др.)
            </label>
<label style="display:flex;align-items:center;gap:8px;font-size:.875rem">
<input name="org" type="radio"/> Индивидуальный предприниматель (ИП)
            </label>
</div>
<div style="margin-bottom:20px">
<label style="display:block;font-weight:600;font-size:.875rem;margin-bottom:8px">* ИНН или юридическое название</label>
<input class="tm-input-text-decorated__input" style="width:100%" type="text"/>
</div>
<div style="display:flex;justify-content:space-between;border-top:1px solid var(--icon-secondary);padding-top:16px">
<button class="btn btn_transparent btn_middle" type="button">Вернуться</button>
<button class="btn btn_solid btn_middle tm-button_color-christi" type="button">Далее</button>
</div>
</div>
<div style="width:180px;flex:none;background:var(--background-primary);padding:20px;border-radius:8px">
<div style="font-size:.75rem;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px">Прогресс</div>
<div style="color:var(--accent-positive);font-size:.875rem;margin-bottom:10px">✓ Правила</div>
<div style="color:var(--accent-positive);font-size:.875rem;margin-bottom:10px">✓ Контакты</div>
<div style="color:var(--accent-positive);font-size:.875rem;margin-bottom:10px">✓ Тариф</div>
<div style="color:var(--accent-positive);font-size:.875rem;margin-bottom:10px">✓ Профиль</div>
<div style="color:var(--accent-primary);font-weight:700;font-size:.875rem">5 Реквизиты</div>
</div>
</div>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
