<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">

</head>
<body class="migration-example migration-example--page pattern-feed">

<div style="display:flex;justify-content:space-between;align-items:center;max-width:620px;margin-bottom:16px">
<div class="tabs" style="flex:1;min-width:0">
<div class="tabs-scroll-area"><div class="tabs-padding-area">
<span class="tab-item"><button class="active tab-link" type="button">Разработка</button></span>
<span class="tab-item"><button class="tab-link" type="button">Администрирование</button></span>
<span class="tab-item"><button class="tab-link" type="button">Дизайн</button></span>
</div></div>
</div>
</div>
<div class="tm-articles-list__item" style="max-width:620px">
<div class="article-snippet" style="margin-bottom:0">
<div class="publication-type-label">
<span class="publication-type-label__label publication-type-label__label_type-post">Пост</span>
</div>
<div class="meta-container"><div class="meta">
<span class="tm-user-info author">
<img alt="" class="tm-user-info__userpic avatar-default avatar-default_user" height="24" src="../../../../ui/assets/illustrations/avatars/avatar-default-user.svg" width="24"/>
<span class="tm-user-info__user tm-user-info__user_appearance-default">
<a class="tm-user-info__username" href="../../../../ui/assets/icons/megazord.svg#feed">alexeyko</a>
<a class="tm-article-datetime-published tm-article-datetime-published_link" href="../../../../ui/assets/icons/megazord.svg#feed">
<time>вчера в 14:20</time></a>
</span>
</span>
</div></div>
<h2 class="tm-title tm-title_h2" style="margin:0 0 8px">
<a class="tm-title__link" href="../../../../ui/assets/icons/megazord.svg#feed">Как мы переписали пайплайн сборки CSS</a>
</h2>
<div class="stats">
<div class="tm-article-reading-time">
<svg class="tm-svg-img tm-article-reading-time__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#clock"></use></svg>
<span class="tm-article-reading-time__label">6 мин</span>
</div>
<span class="tm-icon-counter">
<svg class="tm-svg-img tm-icon-counter__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-views"></use></svg>
<span class="tm-icon-counter__value">3.2k</span>
</span>
</div>
<div class="tm-publication-hubs__container"><div class="tm-publication-hubs">
<span class="tm-publication-hub__link-container">
<a class="tm-publication-hub__link" href="../../../../ui/assets/icons/megazord.svg#feed">Разработка веб-сайтов<span class="tm-article-snippet__profiled-hub" title="Профильный хаб"> * </span></a>
</span>
</div></div>
</div>
<div class="tm-articles-list__item-footer">
<div class="tm-data-icons" style="display:flex;gap:16px;align-items:center">
<div class="tm-votes-meter">
<svg class="tm-svg-img tm-votes-meter__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-rating"></use></svg>
<span class="tm-votes-meter__value tm-votes-meter__value_appearance-article tm-votes-meter__value_rating">24</span>
</div>
<button class="bookmarks-button" title="Добавить в закладки" type="button">
<span class="icon"><svg class="tm-svg-img" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-favorite"></use></svg></span>
<span class="counter">12</span>
</button>
</div>
</div>
</div>
<div class="tm-articles-list__item" style="max-width:620px">
<div class="article-snippet" style="margin-bottom:0">
<div class="publication-type-label">
<span class="publication-type-label__label publication-type-label__label_type-news">Новость</span>
</div>
<div class="meta-container"><div class="meta">
<span class="tm-user-info author">
<img alt="" class="tm-user-info__userpic avatar-default avatar-default_user" height="24" src="../../../../ui/assets/illustrations/avatars/avatar-default-user.svg" width="24"/>
<span class="tm-user-info__user tm-user-info__user_appearance-default">
<a class="tm-user-info__username" href="../../../../ui/assets/icons/megazord.svg#feed">habr</a>
<a class="tm-article-datetime-published tm-article-datetime-published_link" href="../../../../ui/assets/icons/megazord.svg#feed">
<time>сегодня в 09:14</time></a>
</span>
</span>
</div></div>
<h2 class="tm-title tm-title_h2" style="margin:0 0 8px">

</h2>
<div class="stats">
<div class="tm-article-reading-time">
<svg class="tm-svg-img tm-article-reading-time__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#clock"></use></svg>
<span class="tm-article-reading-time__label">2 мин</span>
</div>
</div>
</div>
<div class="tm-articles-list__item-footer">
<div class="tm-data-icons" style="display:flex;gap:16px;align-items:center">
<div class="tm-votes-meter">
<svg class="tm-svg-img tm-votes-meter__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-rating"></use></svg>
<span class="tm-votes-meter__value tm-votes-meter__value_appearance-article tm-votes-meter__value_rating">7</span>

</div>
</div>
</div>

<svg class="tm-svg-img tm-pagination__arrow" height="16" width="16">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#arrow-back"></use></svg>
<span class="tm-pagination__navigation-link-title">Назад</span>
</a>
<div class="tm-pagination__pages">
<span class="tm-pagination__page tm-pagination__page_current">1</span>
<a class="tm-pagination__page" href="../../../../ui/assets/icons/megazord.svg#feed">2</a>
<a class="tm-pagination__page" href="../../../../ui/assets/icons/megazord.svg#feed">3</a>
</div>
<a class="tm-pagination__navigation-link tm-pagination__navigation-link_active" href="../../../../ui/assets/icons/megazord.svg#feed">
<span class="tm-pagination__navigation-link-title">Далее</span>
<svg class="tm-svg-img tm-pagination__arrow tm-pagination__arrow_next" height="16" width="16">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#arrow-back"></use></svg>
</a>
</div>
