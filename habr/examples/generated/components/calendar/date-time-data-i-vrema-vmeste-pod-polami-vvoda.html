<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>date + time — дата и время вместе, под полями ввода</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-components.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--intrinsic">


<div class="tm-calendar" style="max-width:320px">
<div class="tm-calendar__fields">
<div class="tm-input-text-decorated"><input class="tm-input-text-decorated__input" type="text" value="17.08.2023"/></div>
<div class="tm-input-text-decorated tm-input-text-decorated_time"><input class="tm-input-text-decorated__input" type="text" value="17:45"/></div>
</div>
<div class="tm-calendar__panes">
<div>
<div class="tm-calendar__header">
<button aria-label="Предыдущий месяц" class="tm-calendar-arrow" type="button"><svg><use xlink:href="../../../../ui/assets/icons/megazord.svg#arrow-back"></use></svg></button>
<div class="tm-calendar__title">Август 2023</div>
<button aria-label="Следующий месяц" class="tm-calendar-arrow tm-calendar-arrow_next" type="button"><svg><use xlink:href="../../../../ui/assets/icons/megazord.svg#arrow-back"></use></svg></button>
</div>
<div class="tm-calendar__grid">
<span class="tm-calendar-cell tm-calendar-cell_another-month">31</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">1</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">2</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">3</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">4</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">5</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">6</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">7</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">8</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">9</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">10</span>
<span class="tm-calendar-cell tm-calendar-cell_disabled">11</span>
<span class="tm-calendar-cell">12</span>
<span class="tm-calendar-cell">13</span>
<span class="tm-calendar-cell">14</span>
<span class="tm-calendar-cell">15</span>
<span class="tm-calendar-cell">16</span>
<span class="tm-calendar-cell tm-calendar-cell_selected">17</span>
<span class="tm-calendar-cell">18</span>
<span class="tm-calendar-cell">19</span>
<span class="tm-calendar-cell">20</span>
<span class="tm-calendar-cell">21</span>
<span class="tm-calendar-cell">22</span>
<span class="tm-calendar-cell">23</span>
<span class="tm-calendar-cell">24</span>
<span class="tm-calendar-cell">25</span>
<span class="tm-calendar-cell">26</span>
<span class="tm-calendar-cell">27</span>
<span class="tm-calendar-cell">28</span>
<span class="tm-calendar-cell">29</span>
<span class="tm-calendar-cell">30</span>
<span class="tm-calendar-cell">31</span>
<span class="tm-calendar-cell tm-calendar-cell_another-month">1</span>
<span class="tm-calendar-cell tm-calendar-cell_another-month">2</span>
<span class="tm-calendar-cell tm-calendar-cell_another-month">3</span>
</div>
</div>
<div class="tm-calendar__time">
<span class="tm-calendar-cell tm-calendar-cell_time tm-calendar-cell_disabled">16:45</span>
<span class="tm-calendar-cell tm-calendar-cell_time tm-calendar-cell_disabled">17:00</span>
<span class="tm-calendar-cell tm-calendar-cell_time">17:15</span>
<span class="tm-calendar-cell tm-calendar-cell_time">17:30</span>
<span class="tm-calendar-cell tm-calendar-cell_time tm-calendar-cell_selected">17:45</span>
<span class="tm-calendar-cell tm-calendar-cell_time">18:00</span>
<span class="tm-calendar-cell tm-calendar-cell_time">18:15</span>
<span class="tm-calendar-cell tm-calendar-cell_time">18:30</span>
<span class="tm-calendar-cell tm-calendar-cell_time">18:45</span>
<span class="tm-calendar-cell tm-calendar-cell_time">19:00</span>
</div>
</div>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
