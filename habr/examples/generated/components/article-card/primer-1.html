<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пример 1</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-components.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--intrinsic">

<div class="tm-articles-list__item">
<div class="article-snippet" style="margin-bottom:0">
<div class="publication-type-label">
<span class="publication-type-label__label publication-type-label__label_type-post">Пост</span>
</div>
<div class="meta-container"><div class="meta">
<span class="tm-user-info author">
<img alt="" class="tm-user-info__userpic avatar-default avatar-default_user" height="24" src="../../../../ui/assets/illustrations/avatars/avatar-default-user.svg" width="24"/>
<span class="tm-user-info__user tm-user-info__user_appearance-default">
<a class="tm-user-info__username" href="../../../../ui/assets/icons/megazord.svg#article-card">alexeyko</a>
<a class="tm-article-datetime-published tm-article-datetime-published_link" href="../../../../ui/assets/icons/megazord.svg#article-card">
<time>вчера в 14:20</time></a>
</span>
</span>
</div></div>
<h2 class="tm-title tm-title_h2" style="margin:0 0 8px">
<a class="tm-title__link" href="../../../../ui/assets/icons/megazord.svg#article-card">Как мы переписали пайплайн сборки CSS</a>
</h2>
<div class="stats">
<div class="tm-article-reading-time">
<svg class="tm-svg-img tm-article-reading-time__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#clock"></use></svg>
<span class="tm-article-reading-time__label">6 мин</span>
</div>
<span class="tm-icon-counter">
<svg class="tm-svg-img tm-icon-counter__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-views"></use></svg>
<span class="tm-icon-counter__value">3.2k</span>
</span>
</div>
<div class="tm-publication-hubs__container"><div class="tm-publication-hubs">
<span class="tm-publication-hub__link-container">
<a class="tm-publication-hub__link" href="../../../../ui/assets/icons/megazord.svg#article-card">Разработка веб-сайтов<span class="tm-article-snippet__profiled-hub" title="Профильный хаб"> * </span></a>
</span>
</div></div>
</div>
<div class="tm-articles-list__item-footer">
<div class="tm-data-icons">
<div class="tm-votes-meter tm-data-icons__item">
<svg class="tm-svg-img tm-votes-meter__icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-rating"></use></svg>
<span class="tm-votes-meter__value tm-votes-meter__value_appearance-article tm-votes-meter__value_rating">24</span>
</div>
<button class="bookmarks-button tm-data-icons__item" title="Добавить в закладки" type="button">
<span class="tm-svg-icon__wrapper icon"><svg class="tm-svg-img tm-svg-icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-favorite"></use></svg></span>
<span class="counter">12</span>
</button>
<div class="article-comments-counter-link-wrapper tm-data-icons__item">
<a class="article-comments-counter-link" href="../../../../ui/assets/icons/megazord.svg#article-card">
<svg class="tm-svg-img icon" height="24" width="24">
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-comments"></use></svg>
<span class="value">18</span>
</a>
</div>
</div>
</div>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
