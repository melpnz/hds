<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Четыре типа — подложка и рамка в цвет типа</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-components.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--intrinsic">


<div class="doc-informer-grid">
<div class="informer-hint informer-hint_type-info" style="--informer-hint-width:320px">
<div class="informer-hint__row">
<svg class="tm-svg-img informer-hint__icon" height="24" width="24"><title>Информация</title>
<use xlink:href="../../../../ui/assets/icons/megazord.svg#user-notice-info"></use></svg>
<div class="informer-hint__content"><h3>Заголовок</h3><p>Текст</p></div>
<span class="informer-hint__date">Дата и время</span>
</div>
<button aria-label="Закрыть" class="close-informer-hint" type="button">
<svg class="tm-svg-img" height="16" width="16"><use xlink:href="../../../../ui/assets/icons/megazord.svg#close"></use></svg>
</button>
</div>
<div class="informer-hint informer-hint_type-success" style="--informer-hint-width:320px">
<div class="informer-hint__row">
<svg class="tm-svg-img informer-hint__icon" height="24" width="24"><title>Успех</title>
<use xlink:href="../../../../ui/assets/icons/megazord.svg#user-notice-success"></use></svg>
<div class="informer-hint__content"><h3>Заголовок</h3><p>Текст</p></div>
<span class="informer-hint__date">Дата и время</span>
</div>
<button aria-label="Закрыть" class="close-informer-hint" type="button">
<svg class="tm-svg-img" height="16" width="16"><use xlink:href="../../../../ui/assets/icons/megazord.svg#close"></use></svg>
</button>
</div>
<div class="informer-hint informer-hint_type-warning" style="--informer-hint-width:320px">
<div class="informer-hint__row">
<svg class="tm-svg-img informer-hint__icon" height="24" width="24"><title>Предупреждение</title>
<use xlink:href="../../../../ui/assets/icons/megazord.svg#user-notice-warning"></use></svg>
<div class="informer-hint__content"><h3>Заголовок</h3><p>Текст</p></div>
<span class="informer-hint__date">Дата и время</span>
</div>
<button aria-label="Закрыть" class="close-informer-hint" type="button">
<svg class="tm-svg-img" height="16" width="16"><use xlink:href="../../../../ui/assets/icons/megazord.svg#close"></use></svg>
</button>
</div>
<div class="informer-hint informer-hint_type-danger" style="--informer-hint-width:320px">
<div class="informer-hint__row">
<svg class="tm-svg-img informer-hint__icon" height="24" width="24"><title>Ошибка</title>
<use xlink:href="../../../../ui/assets/icons/megazord.svg#user-notice-error"></use></svg>
<div class="informer-hint__content"><h3>Заголовок</h3><p>Текст</p></div>
<span class="informer-hint__date">Дата и время</span>
</div>
<button aria-label="Закрыть" class="close-informer-hint" type="button">
<svg class="tm-svg-img" height="16" width="16"><use xlink:href="../../../../ui/assets/icons/megazord.svg#close"></use></svg>
</button>
</div>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
