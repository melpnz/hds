<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VotesLever — рычаг «нравится / не нравится»</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-components.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--intrinsic">


<div class="tm-votes-lever tm-votes-lever_appearance-article votes-switcher" style="width:max-content" title="Всего голосов 126: ↑126 и ↓0">
<button class="tm-votes-lever__button" title="Нравится" type="button">
<svg class="tm-svg-img tm-votes-lever__icon" height="24" width="24"><title>Нравится</title>
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-vote"></use></svg>
</button>
<div class="tm-votes-lever__score tm-votes-lever__score_appearance-article tm-votes-lever__score_no-margin">
<span class="tm-votes-lever__score-counter tm-votes-lever__score-counter_positive">+156</span>
</div>
<button class="tm-votes-lever__button" title="Не нравится" type="button">
<svg class="tm-svg-img tm-votes-lever__icon tm-votes-lever__icon_arrow-down" height="24" width="24"><title>Не нравится</title>
<use xlink:href="../../../../ui/assets/icons/megazord.svg#counter-vote"></use></svg>
</button>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
