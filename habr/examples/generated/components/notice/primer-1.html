<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пример 1</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-components.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--intrinsic">

<div class="tm-notice" style="min-width:auto;max-width:none">
<div class="tm-notice__inner"><div class="tm-notice__content">Нейтральный вид, полоса слева серая.</div></div>
</div>
<div class="tm-notice tm-notice_positive" style="min-width:auto;max-width:none">
<div class="tm-notice__inner"><div class="tm-notice__content">Positive — полоса зелёная.</div></div>
</div>
<div class="tm-notice tm-notice_negative" style="min-width:auto;max-width:none">
<div class="tm-notice__inner"><div class="tm-notice__content">Negative — полоса красная.</div></div>
</div>
<div class="tm-notice tm-notice_warning" style="min-width:auto;max-width:none">
<div class="tm-notice__inner"><div class="tm-notice__content">Warning — заливка целиком, без полосы.</div></div>
</div>
<div class="tm-notice tm-notice_info" style="min-width:auto;max-width:none">
<div class="tm-notice__inner"><div class="tm-notice__content">Info — рамка вместо полосы.</div></div>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
