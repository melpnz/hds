<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пример 1</title>
  <link rel="stylesheet" href="../../../../ui/themes/light-v2.css">
  <link rel="stylesheet" href="../../../../ui/habr.css">
  <link rel="stylesheet" href="../../../../examples/showcase-components.css">
  <link rel="stylesheet" href="../../../../examples/example-shell.css">
</head>
<body class="migration-example migration-example--intrinsic">

<div class="doc-row doc-gap-big">
<button class="tm-icon-button" title="Закрыть" type="button">
<svg class="tm-svg-img" height="20" width="20"><use xlink:href="../../../../ui/assets/icons/megazord.svg#close"></use></svg>
</button>
<button class="tm-icon-button" style="color:var(--accent-primary)" title="Редактировать" type="button">
<svg class="tm-svg-img" height="20" width="20"><use xlink:href="../../../../ui/assets/icons/megazord.svg#pencil"></use></svg>
</button>
<button class="tm-icon-button" disabled="" title="Недоступно" type="button">
<svg class="tm-svg-img" height="20" width="20"><use xlink:href="../../../../ui/assets/icons/megazord.svg#dots"></use></svg>
</button>
<button class="tm-icon-button tm-icon-button_bordered" title="С рамкой (border=yes)" type="button">
<svg class="tm-svg-img" height="20" width="20"><use xlink:href="../../../../ui/assets/icons/megazord.svg#search"></use></svg>
</button>
<button class="tm-icon-button tm-icon-button_near-field" title="near-textfield=yes" type="button">
<svg class="tm-svg-img" height="24" width="24"><use xlink:href="../../../../ui/assets/icons/megazord.svg#close"></use></svg>
</button>
</div>

<script src="../../../../examples/components.js"></script>
</body>
</html>
